<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Melodle Song Quiz</title>
	<link rel="icon" type="image/x-icon" href="img/logo.png">
	<style>
		body {
			font-family: Helvetica;
			background-color: #f6f6f6;
			overscroll-behavior: none;
			margin: 0;
			min-height: 100vh;
			display: flex;
			padding: 5vh 16px;
			box-sizing: border-box;
		}

		table {
			border-collapse: collapse;
			table-layout: fixed;
			width: 100%;

		}

		tr {
			height: 45px;
		}

		td,
		th {
			border: 1px solid #000000;
			font-size: 16px;
			padding: 5px;
		}

		a {
			cursor: pointer;
		}

		img {
			width: 35px;
			margin: auto;
			top: 5px;
			left: 5px;
			position: relative;
		}

		label {
			font-size: 13.5px;
		}

		.num-box {
			width: 5%;
			min-width: 50px;
			text-align: center;
			font-size: 18px;
		}

		.guess-box {
			padding-left: 1%;
			padding-right: 1%;
			text-align: left;
		}

		.switcher {
			display: inline-flex;
			flex-direction: row;
			padding: 10px;
			justify-content: space-between;
			flex-grow: 1;
			width: 50%;
			align-items: center;
		}

		#completed-text {
			margin: auto;
			font-size: 28px;
			text-align: center;
		}

		#header {
			display: grid;
			grid-template-columns: 4fr 1fr;
			width: 70%;
			left: 13%;
			position: relative;
			gap: 5px;
			margin-top: 3%;
			border: 1px solid black;
			padding: 10px 2%;
		}

		.checkboxes {
			display: grid;
			grid-template-columns: 1fr;
			padding-top: 1%;
		}

		.new-quiz-btn-container {
			display: grid;
			grid-template-columns: 1fr;
			gap: 5px;
			align-items: center;
			justify-items: center;
		}

		.newQuizBtn {
			margin-bottom: 10px;
		}

		.category-title {
			font-weight: bold;
		}

		.checkbox-category {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 2px;
			padding-top: 1%;
			padding-bottom: 1%;
		}

		.checkbox-set {
			display: grid;
			grid-template-columns: 0.5fr 3fr;
			align-items: center;
			gap: 5px;
		}

		.container {
			position: relative;
			margin: auto;
			display: block;
			width: 750px;
		}

		.container-row {
			width: 100%;
			padding: 5px;
			justify-content: space-between;
			align-items: center;
		}

		#title-row {
			 border-bottom: solid;
		}

		#title {
			 font-size: 60px;
			 margin: auto;
			 text-align: center;
		}

		.wrong-answer {
			border: 1px solid black;
			width: 45px;
			height: 45px;
		}

		#new-quiz-section {
			position: absolute;
			box-sizing: border-box;
			border: 1px solid black;
			background: #D3CCCA;
			padding: 0px;
			z-index: 1;
			display: grid;
			grid-template-columns: 1fr;
			align-items: center;
			justify-items: center;
			font-size: 28px;
		}

		.dialog-visible {
			opacity: 1;
		}

		.dialog-invisible {
			visibility: hidden;
			opacity: 0;
			transition: visibility 0s 2s, opacity 2s linear;
		}

		.slider-container {
			display: grid;
			grid-template-columns: 1fr 4fr 1fr;
			gap: 5px;
			align-items: center;
			justify-items: center;
		}

		.volume-slider {
			padding: 0;
		}

		.volume-icon {
			width: 22px;
			height: auto;
			position: static;
			cursor: pointer;
		}

		#main-section-1 {
			padding-top: 4%;
			padding-bottom: 2%;
			display: grid;
			grid-template-columns: 4fr 0.5fr 1fr 0.5fr 1fr 4fr;
			justify-items: center;
			width: 70%;
			left: 15%;
			position: relative;
		}

		#main-section-1 img {
			position: static;
		}

		#main-section-1 .active-button {
			cursor: pointer;
		}

		#main-section-2 {
			display: grid;
			grid-template-columns: 4fr 1fr;
			gap: 10px;
			justify-items: center;
			width: 70%;
			left: 15%;
			position: relative;
		}

		#main-section-3 {
			display: grid;
			grid-template-columns: 4fr 1fr;
			gap: 10px;
			width: 70%;
			left: 15%;
			position: relative;
			justify-items: center;
			padding-top: 4%;
		}

		#wrong-answer-boxes {
			width: 100%;
			display: grid;
			grid-template-columns: 0.5fr repeat(5, 1fr) 0.5fr;
			justify-items: center;
		}

		#main-section-4 {
			padding-top: 5%;
			padding-bottom: 5%;
			width: 130%;
			left: -15%;
			position: relative;
			box-sizing: border-box;
		}

		#game-over-section-1 {
			padding-top: 3%;
			font-size: 60px;
			text-align: center;
			display: none;
		}

		#game-over-section-2 {
			font-size: 30px;
			text-align: center;
			display: none;
		}

		#playlist {
			text-align: center;
			padding-right: 13px;
			font-size: 17px;
		}

		#player-iframe {
			width: 0;
			height: 0;
			overflow: hidden;
			padding: 0;
			box-sizing: border-box;
			display: block;
		}

		#seedInput {
			text-align: center;
			width: 100%;
			padding: 10px 6px;
			box-sizing: border-box;
		}

		/* Chrome, Safari, Edge, Opera -- to remove arrows*/
		input::-webkit-outer-spin-button,
		input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		/* Firefox */
		input[type=number] {
			-moz-appearance: textfield;
		}

		button {
			width: 110px;
			height: 50px;
			margin-left: 1%;
			margin-right: 1%;
			border-radius: 10px;
			border: 0;
			background: #191414;
			color: #fff;
			font-size: 15px;
			cursor: pointer;
		}
		
		button:hover {
			background: #515151;
		}

		button:disabled {
			background-color: #515151;
			cursor: auto;
		}

		label {
			white-space: nowrap;
		}

		#playBtn img {
			left: 0;
			top: 0;
		}

		.short-button {
			height: 110%;
			border-radius: 5px;
			padding: 4px;
		}

		.autocomplete {
			/*the container must be positioned relative:*/
			position: relative;
			display: inline-block;
			width: 100%;
		}

		input {
			border: 1px solid #000;
			background-color: #f1f1f1;
			padding: 10px 35px 10px 10px;
			font-size: 16px;
			box-sizing: border-box;
		}

		input[type=text] {
			background-color: #f1f1f1;
			width: 100%;
		}

		.autocomplete-items {
			position: absolute;
			border: 1px solid #d4d4d4;
			border-bottom: none;
			z-index: 99;
			/*position the autocomplete items to be the same width as the container:*/
			top: 100%;
			left: 0;
			right: 0;
			overflow-y: auto;
			max-height: 317px;
		}

		.autocomplete-items div {
			padding: 10px;
			cursor: pointer;
			background-color: #fff;
			border-bottom: 1px solid #d4d4d4;
		}

		.autocomplete-items div:hover {
			/*when hovering an item:*/
			background-color: #e9e9e9;
		}

		.autocomplete-active {
			/*when navigating through the items using the arrow keys:*/
			background-color: DodgerBlue !important;
			color: #ffffff;
		}

		.auto-container {
			width: 100%;
			padding-right: 5px;
		}

		.inline-img {
			width: 19px;
			height: auto;
			position: static;
		}

		.row-pause-wrap {
			position: relative;
			width: 22px;
			height: 22px;
			margin: auto;
			display: none;
			align-items: center;
			justify-content: center;
			cursor: pointer;
		}

		.clip-ring-svg {
			position: absolute;
			top: 0;
			left: 0;
			width: 22px;
			height: 22px;
			transform: rotate(-90deg);
		}

		.clip-ring-bg {
			fill: none;
			stroke: #d4d4d4;
			stroke-width: 2.2;
		}

		.clip-ring-fg {
			fill: none;
			stroke: #191414;
			stroke-width: 2.2;
			stroke-linecap: round;
			stroke-dasharray: 56.5487;
			stroke-dashoffset: 56.5487;
		}

		.row-pause-icon {
			width: 8px;
			height: 8px;
			position: static;
			pointer-events: none;
		}

		.answer-box {
			display: grid;
			grid-template-columns: 7fr 1fr;
			gap: 2px;
			align-items: center;
			min-height: 22px;
		}

		.hidden-item {
			display: none;
		}

		.submit {
			position: absolute;
			height: 16px;
			width: auto;
			left: auto;
			right: 12px;
			margin: 0;
			top: 50%;
			transform: translate(0, -50%);
			cursor: pointer;
		}

		.modals-subcontainer {
			display: flex;
			flex-direction: column;
			gap: 5px;
			align-items: center;
		}

		/* this entire section is for the difficulty toggle */

		/* The switch - the box around the slider */
		.switch {
			position: relative;
			display: inline-block;
			width: 50px;
			height: 22px;
		}
		/* Hide default HTML checkbox */
		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}
		/* The slider */
		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ccc;
		}
		.slider:before {
			position: absolute;
			content: "";
			height: 16px;
			width: 16px;
			left: 3px;
			bottom: 3px;
			background-color: white;
		}
		input:checked + .slider {
			background-color: #171717;
		}
		input:focus + .slider {
			box-shadow: 0 0 1px #171717;
		}
		input:checked + .slider:before {
			-webkit-transform: translateX(28px);
			-ms-transform: translateX(28px);
			transform: translateX(28px);
		}
		/* Rounded sliders */
		.slider.round {
			border-radius: 34px;
		}
		.slider.round:before {
			border-radius: 50%;
		}

		/* end section for difficulty toggle */
		.mode-nav {
			position: fixed;
			top: 20px;
			left: 16px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			z-index: 100;
			font-family: Helvetica, Arial, sans-serif;
		}
		.mode-nav a {
			display: block;
			padding: 7px 14px;
			border-radius: 8px;
			font-size: 13px;
			font-weight: bold;
			text-decoration: none;
			text-align: center;
			color: #191414;
			background-color: #ffffff;
			border: 1px solid #cccccc;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
			cursor: pointer;
		}
		.mode-nav a:hover {
			background-color: #e8e8e8;
		}
		.mode-nav a.active {
			background-color: #191414;
			color: #ffffff;
			border-color: #191414;
		}
		@media (max-width: 1260px) {
			body {
				flex-direction: column;
				align-items: center;
				gap: 16px;
			}
			.mode-nav {
				position: static;
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
			}
		}
		@media (max-width: 1010px) {
			#main-section-4 {
				width: 100%;
				left: 0;
			}
		}
	</style>
</head>

	<script type="text/javascript">
		var quizLinks = [];
		var songLinks = [];
		var quizSongs = [];
		var timestamps = [];
		var songs = [];
		var timer = 4000;
		var songVal = 0;
		var clipIndex = 0;
		var totalSongs = 30;
		var wrongAnswers = 0;
		var seed = 0;
		var playing = false;
		var buffering = false;

		let timeRunning = null;
		let firstQuiz = true;
		let playbackToken = 0;
		let pendingLoadToken = -1;
		let clipEndTime = null;
		let clipOriginSec = 0;
		let clipStartSec = 0;
		let clipTotalSec = 4;
		let activeRowIndex = -1;
		let quizEmbedController = null;
		let embedIsPlaying = false;
		let embedPauseIgnoreUntil = 0;
		let quizTitles = [];
		let quizGeneration = 0;
		const RING_CIRCUMFERENCE = 2 * Math.PI * 9;
		let clipRafId = null;
		let guessedSongs = new Set();
		const preloadAudio = new Audio();
		preloadAudio.preload = "auto";

		window.onSpotifyIframeApiReady = (IFrameAPI) => {
			const element = document.getElementById('embed-iframe');
			const options = {
				width: '100%',
				height: '200px'
			};
			const callback = (EmbedController) => {
				quizEmbedController = EmbedController;
				EmbedController.addListener('playback_update', function(e) {
					if (!e || !e.data) return;
					embedIsPlaying = !e.data.isPaused;
					if (e.data.isPaused)
					{
						embedPauseIgnoreUntil = 0;
						return;
					}
					if (performance.now() < embedPauseIgnoreUntil) return;
					if (playing || activeRowIndex !== -1)
					{
						pausePlayback();
					}
				});

		function finishCurrentClip(token) {
			if (token !== playbackToken)
			{
				return;
			}
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearRowPlaying();
			if (playing)
			{
				const activeCount = quizSongs.length || totalSongs;
				if (songVal < activeCount - 1)
				{
					incrementSong(1);
				}
				else
				{
					pausePlayback();
					incrementSong(-1 * songVal);
				}
			}
			else

			}
		}

		function monitorClipProgress(token) {
			if (token !== playbackToken || activeRowIndex === -1)
			{
				return;
			}
			if (!audio.paused && !audio.seeking)
			{
				const fg = document.getElementById("ringFg" + (activeRowIndex + 1));
				if (fg && clipTotalSec > 0)
				{
					const frac = Math.max(0, Math.min(1, (audio.currentTime - clipStartSec) / clipTotalSec));
					fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - frac));
				}
				if (clipEndTime !== null && audio.currentTime >= clipEndTime)
				{
					finishCurrentClip(token);
					return;
				}
			}
			clipRafId = requestAnimationFrame(function() {
				monitorClipProgress(token);
			});
		}

		function beginTrackAt(targetIdx, token) {
			if (token !== playbackToken) return;
			showRowPlaying(targetIdx);
			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipOriginSec = 0;
				clipStartSec = 0;
				clipEndTime = null;
				clipTotalSec = dur;
				audio.currentTime = 0;
			}
			else
			{
				const clipSec = timer / 1000;
				const maxStart = Math.max(0, dur - clipSec);
				clipStartSec = Math.min(timestamps[targetIdx] || 0, maxStart);
				clipOriginSec = clipStartSec;
				clipEndTime = Math.min(clipStartSec + clipSec, dur - 0.03);
				clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
				audio.currentTime = clipStartSec;
			}
			const playPromise = audio.play();
			if (playPromise && typeof playPromise.catch === "function")
			{
				playPromise.catch(function(err) {
					if (token === playbackToken && (!err || err.name !== "AbortError"))
					{
						pausePlayback();
					}
				});
			}
			monitorClipProgress(token);
		}

		async function createSongQuiz() {
			const rawSeed = document.getElementById("seedInput").value.trim();
			if (!/^\d+$/.test(rawSeed))
			{
				showNewQuizDialog("Numeric seeds only!");
				return;
			}

			const selectedInputs = Array.from(document.querySelectorAll('#checkboxes input[type="checkbox"]:checked'));
			if (selectedInputs.length === 0)
			{
				updateNewQuizBtn();
				return;
			}

			const gen = ++quizGeneration;
			pausePlayback();
			pauseQuizEmbed();
			if (!firstQuiz)
			{
				showNewQuizDialog();
			}

			const rawFiles = [];
			for (let i = 0; i < selectedInputs.length; i++)
			{
				const file = await fetch(`jsons/${selectedInputs[i].id}.json`);
				const fileText = await file.text();
				if (gen !== quizGeneration) return;
				rawFiles.push([selectedInputs[i], fileText]);
			}
			if (gen !== quizGeneration) return;

			seed = Number(rawSeed);
			resetHTML();
			let songStats = [];

			const shuffledFiles = shuffle(rawFiles);

			let maxListLength = 0;
			for (let i = 0; i < shuffledFiles.length; i++)
			{
				const fileArr = parseStringToJsonToArrays(shuffledFiles[i][1]);
				maxListLength = fileArr.length > maxListLength ? fileArr.length : maxListLength;
				songStats.push(shuffle(fileArr));
			}

			let songStatsEqualized = [];
			for (let i = 0; i < maxListLength; i++)
			{
				for (const arr of songStats)
				{
					if (i < arr.length)
					{
						songStatsEqualized.push(arr[i]);
					}
				}
			}

			const seenUris = new Set();
			const seenPreviews = new Set();
			const seenNormKeys = new Set();
			let songStatsCleaned = [];
			for (let i = 0; i < songStatsEqualized.length; i++)
			{
				const stat = songStatsEqualized[i];
				const uriKey = stat[2] || "";
				const prevKey = (stat[1] || "").split("?")[0];
				const normKey = normalizeSongKey(stat[3] || stat[0], stat[4] || "");
				if ((uriKey && seenUris.has(uriKey)) || (prevKey && seenPreviews.has(prevKey)) || (normKey && seenNormKeys.has(normKey)))
				{
					continue;
				}
				if (uriKey) seenUris.add(uriKey);
				if (prevKey) seenPreviews.add(prevKey);
				if (normKey) seenNormKeys.add(normKey);
				songStatsCleaned.push(stat);
			}

			let quizStats = [];
			for (let i = 0; i < songStatsCleaned.length; i++)
			{
				if (i < totalSongs)
				{
					quizStats.push(songStatsCleaned[i]);
															// length of Spotify previews
					timestamps.push(Math.floor(seededRandom((30 - (timer / 1000)))));

					let songBox = document.getElementById("guess" + (i + 1));
					let songTitleBox = document.createElement("div");
					songTitleBox.classList.add('answer-box');
					let blankContainer = document.createElement("div");
					let blank = document.createElement("text");
					blank.id = "guessText" + (i + 1);

					const speakerIcon = document.createElement("img");
					speakerIcon.id = "speaker" + (i + 1);
					speakerIcon.src = "img/speaker.png";
					speakerIcon.classList.add("inline-img");
					speakerIcon.style.cursor = "pointer";
					speakerIcon.onclick = function () {
						loadClip(i);
					};

					const pauseWrap = document.createElement("div");
					pauseWrap.id = "pauseWrap" + (i + 1);
					pauseWrap.classList.add("row-pause-wrap");
					pauseWrap.innerHTML = '<svg class="clip-ring-svg" viewBox="0 0 22 22"><circle class="clip-ring-bg" cx="11" cy="11" r="9"></circle><circle class="clip-ring-fg" id="ringFg' + (i + 1) + '" cx="11" cy="11" r="9"></circle></svg><img src="img/clear_pause.png" class="row-pause-icon">';
					pauseWrap.onclick = function () {
						pausePlayback();
					};

					blankContainer.appendChild(blank);
					songTitleBox.appendChild(blankContainer);
					songTitleBox.appendChild(speakerIcon);
					songTitleBox.appendChild(pauseWrap);

					songBox.appendChild(songTitleBox);
				}
				songs.push(songStatsCleaned[i][0]);
			}

			quizStats = shuffle(quizStats);
			for (const songStat of quizStats)
			{
				// console.log(songStat[0]); // for debugging
				quizSongs.push(songStat[0]);
				quizLinks.push(songStat[1]);
				songLinks.push(songStat[2]);
				quizTitles.push(songStat[3]);
			}

			// now with alphabetical powers
			document.getElementById("currentSong").innerText = quizSongs.length ? ("1 of " + quizSongs.length) : "0 of 0";
			toggleButtons();
			songs.sort(sortBySongName);
			autocomplete(document.getElementById("myInput"), songs);
			preloadNextTrack(0);
		}

		function parseStringToJsonToArrays(str) {
			const fileJSON = JSON.parse(str.toString());

			tmpArr = [];

			for (let i of fileJSON)
			{
				if (i.trackLink)
				{
					let trackUri = i.trackLink.replace("\\/", "/");
					if (trackUri.includes("open.spotify.com/track/")) {
						let trackId = trackUri.split("track/")[1].split("?")[0];
						trackUri = "spotify:track:" + trackId;
					}
					tmpArr.push([i.title + " - " + i.artist, i.preview.replace("\\/", "/"), trackUri, i.title, i.artist]);
				}
			}

			return tmpArr;
		}

		function normalizeSongKey(title, artist) {
			const strip = function(s) {
				return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
			};
			const cleanTitle = String(title).replace(/\s*-\s*\d{4}\s*remaster.*|\s*\((?:from|feat\.?|with)\b.*?\)/gi, "");
			const primaryArtist = String(artist).split(/,|\b(?:feat\.?|featuring|with)\b/i)[0];
			return strip(cleanTitle) + "||" + strip(primaryArtist);
		}

		// stolen from https://stackoverflow.com/questions/16801687/javascript-random-ordering-with-seed
		function seededRandom(max) {
			seed = (seed + 0x6D2B79F5) | 0;
			let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return Math.floor((max + 1) * (((t ^ (t >>> 14)) >>> 0) / 4294967296));
		}

		function shuffle(array) {
			var index = array.length - 1;

			while (index > 0)
			{
				let tmpIndex = seededRandom(index);

				let tmp = array[index];
				array[index] = array[tmpIndex];
				array[tmpIndex] = tmp;

				index--;
			}

			return array;
		}

		function resetHTML() {
			cancelClipMonitor();
			pendingLoadToken = -1;
			clearRowPlaying();
			audio.pause();

			quizLinks = [];

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				searchResults = 0;
				for (i = 0; i < arr.length; i++) {
					if (!guessedSongs.has(arr[i]) && arr[i].toUpperCase().includes(val.toUpperCase())) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = document.createElement("DIV");
						index = itemValue.toUpperCase().indexOf(val.toUpperCase());
						b.appendChild(document.createTextNode(itemValue.substr(0, index)));
						const strongEl = document.createElement("STRONG");
						strongEl.textContent = itemValue.substr(index, val.length);
						b.appendChild(strongEl);
						b.appendChild(document.createTextNode(itemValue.substr(index + val.length)));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						searchResults++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}
	</script>
