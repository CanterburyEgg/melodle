<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Melodle Timeline — Place Hot 100 songs in chronological order along a 10-card timeline before 5 strikes.">
	<title>Melodle Timeline</title>
	<link rel="icon" type="image/png" href="img/logo.png">
	<script>(function(){try{var t=localStorage.getItem('melodle-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<nav class="mode-nav" aria-label="Game modes">
		<a href="index.html">Daily Melodle</a>
		<a href="quiz.html">Song Quiz</a>
		<a href="billboard.html">Billboard</a>
		<a href="timeline.html" class="active">Timeline</a>
		<div class="nav-divider"></div>
		<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle color theme">Dark Mode</button>
	</nav>
	<div class="page-container">
		<div class="timeline-top-card">
			<header class="masthead">
				<img src="img/logo.png" class="masthead-logo" alt="Melodle logo">
				<h1 id="title">Melodle Timeline</h1>
			</header>
			<div class="now-playing-container" id="np-container">
				<div class="album-container is-blurred" id="album-container">
					<img id="np-album" alt="Album cover">
				</div>
				<div class="song-data-container" id="song-data-container">
					<div class="tl-audio-player">
						<button type="button" class="icon-btn primary tl-play-btn" id="tlPlayBtn" onclick="toggleTimelineAudio()" aria-label="Play preview"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"></polygon></svg></button>
						<div class="tl-scrubber-wrap">
							<input type="range" class="tl-scrubber" id="tlScrubber" min="0" max="30" step="0.1" value="0" aria-label="Seek preview">
							<span class="tl-time" id="tlTime">0:00</span>
						</div>
					</div>
					<div class="song-data" id="song-data" style="display: none;">
						<div class="song-specs" id="song-specs">
							<div class="data-row" id="song-title"></div>
							<div class="data-row" id="song-artist"></div>
							<div class="data-row" id="song-year"></div>
						</div>
						<button type="button" id="next" onclick="goToNextSong()"><span>Next</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></button>
						<button type="button" id="restart" style="display: none;" onclick="startQuiz()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg><span>Play Again</span></button>
					</div>
					<audio class="hidden-item" id="audio" preload="metadata"></audio>
					<div class="tl-bottom-row">
						<div class="data-row" id="wrong-answer-boxes">
							<div class="wrong-answer" id="wrong-answer-1"></div>
							<div class="wrong-answer" id="wrong-answer-2"></div>
							<div class="wrong-answer" id="wrong-answer-3"></div>
							<div class="wrong-answer" id="wrong-answer-4"></div>
							<div class="wrong-answer" id="wrong-answer-5"></div>
						</div>
						<div class="data-row" id="win" style="display: none;">
							YOU WIN!
						</div>
						<div class="data-row" id="lose" style="display: none;">
							GAME OVER
						</div>
						<div class="slider-container">
							<button type="button" class="volume-btn" onclick="incrementTimelineVolume(-10)" aria-label="Decrease volume" title="Decrease volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg></button>
							<input type="range" class="volume-slider" id="tlVolume" min="0" max="100" step="1" value="35" aria-label="Volume">
							<button type="button" class="volume-btn" onclick="incrementTimelineVolume(10)" aria-label="Increase volume" title="Increase volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="timeline-container">
			<div class="timeline-label">
				<span>Timeline (<span id="tlCount">0</span> / 10)</span>
				<span class="timeline-hint" id="tlHint">Click + to place the first track</span>
			</div>
			<div class="timeline" id="tl-container">
			</div>
		</div>
	</div>

	<script src="theme.js"></script>
	<script>
		let song_data = [];
		let index = 0;
		let insert_index = 0;
		let wrongAnswers = 0;
		let active_song = {};
		let albums = [];
		let years = [];
		let guessing = true;
		let isScrubbing = false;
		let albumLoadToken = 0;
		let albumReady = false;
		const BLANK_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

		const np_album = document.getElementById("np-album");
		const albumContainer = document.getElementById("album-container");
		const tlPlayBtn = document.getElementById("tlPlayBtn");
		const tlScrubber = document.getElementById("tlScrubber");
		const tlTime = document.getElementById("tlTime");
		const tlVolume = document.getElementById("tlVolume");

		function formatAudioTime(sec) {
			if (!isFinite(sec) || sec < 0) sec = 0;
			const whole = Math.floor(sec);
			const mins = Math.floor(whole / 60);
			const secs = String(whole % 60).padStart(2, "0");
			return mins + ":" + secs;
		}

		function resetTimelinePlayerUI() {
			isScrubbing = false;
			tlPlayBtn.innerHTML = MELODLE_ICONS.play;
			tlPlayBtn.setAttribute("aria-label", "Play preview");
			tlScrubber.max = 30;
			tlScrubber.value = 0;
			tlTime.textContent = "0:00";
		}

		function toggleTimelineAudio() {
			if (!audio.getAttribute("src")) return;
			if (audio.paused)
			{
				const p = audio.play();
				if (p && typeof p.catch === "function")
				{
					p.catch(function() {});
				}
			}
			else
			{
				audio.pause();
			}
		}

		audio.addEventListener("play", function() {
			tlPlayBtn.innerHTML = MELODLE_ICONS.pause;
			tlPlayBtn.setAttribute("aria-label", "Pause preview");
		});

		audio.addEventListener("pause", function() {
			tlPlayBtn.innerHTML = MELODLE_ICONS.play;
			tlPlayBtn.setAttribute("aria-label", "Play preview");
		});

		audio.addEventListener("ended", function() {
			tlPlayBtn.innerHTML = MELODLE_ICONS.play;
			tlPlayBtn.setAttribute("aria-label", "Play preview");
		});

		audio.addEventListener("loadedmetadata", function() {
			if (isFinite(audio.duration) && audio.duration > 0)
			{
				tlScrubber.max = audio.duration;
			}
		});

		audio.addEventListener("timeupdate", function() {
			if (!audio.seeking && !isScrubbing)
			{
				if (isFinite(audio.duration) && audio.duration > 0)
				{
					tlScrubber.max = audio.duration;
				}
				tlScrubber.value = audio.currentTime || 0;
				tlTime.textContent = formatAudioTime(audio.currentTime || 0);
			}
		});

		tlScrubber.addEventListener("pointerdown", function() {
			isScrubbing = true;
		});
		window.addEventListener("pointerup", function() {
			isScrubbing = false;
		});
		window.addEventListener("pointercancel", function() {
			isScrubbing = false;
		});
		tlScrubber.addEventListener("change", function() {
			isScrubbing = false;
		});

		tlScrubber.addEventListener("input", function() {
			const target = Number(tlScrubber.value);
			if (isFinite(target))
			{
				audio.currentTime = target;
				tlTime.textContent = formatAudioTime(target);
			}
		});

		tlVolume.addEventListener("input", function() {
			audio.volume = Number(tlVolume.value) / 100;
		});

		function incrementTimelineVolume(i) {
			let vol = parseInt(tlVolume.value, 10) + i;
			if (vol > Number(tlVolume.max)) vol = Number(tlVolume.max);
			if (vol < Number(tlVolume.min)) vol = Number(tlVolume.min);
			tlVolume.value = vol;
			audio.volume = vol / 100;
		}

		document.addEventListener("DOMContentLoaded", async function() {
			try {
				const response = await fetch('./jsons/data/top_10s_data.json');
				song_data = await response.json();
				song_data = song_data.filter(function(song) {
					return Boolean(song && song.link && song.picture);
				});
			}
			catch(error) {
				console.error('Error:', error);
			}

			if (!song_data.length) return;

			shuffle(song_data);

			startQuiz();
		});

		function startQuiz() {
			if (!song_data.length) return;
			albums = [];
			years = [];
			insert_index = 0;

			restart.style.display = 'none';
			win.style.display = 'none';
			lose.style.display = 'none';
			next.style.display = '';

			document.getElementById("wrong-answer-boxes").style.display = '';
			wrongAnswers = 0;
			const elements = document.querySelectorAll(".wrong-answer");
			elements.forEach(element => {
				element.innerHTML = "";
			});

			document.getElementById("tlCount").textContent = "0";
			const timeline = document.getElementById("tl-container");
			timeline.innerHTML = "";
			const firstNode = document.createElement("div");
			firstNode.className = "node is-initial";
			const pill = document.createElement("span");
			pill.className = "node-pill";
			pill.innerHTML = MELODLE_ICONS.plus;
			firstNode.appendChild(pill);
			firstNode.onclick = function() {
				if (!guessing) return;
				insert_index = 0;
				redrawTimeline();
			};
			timeline.appendChild(firstNode);

			audio.volume = Number(tlVolume.value) / 100;
			goToNextSong();
		}

		function goToNextSong() {
			if (!song_data.length) return;
			let checked = 0;
			while (checked < song_data.length) {
				if (index >= song_data.length) {
					shuffle(song_data);
					index = 0;
				}
				const candidate = song_data[index++];
				checked++;
				if (!years.includes(candidate.year)) {
					active_song = candidate;
					break;
				}
			}
			guessing = true;
			albumReady = false;
			const loadToken = ++albumLoadToken;
			np_album.style.visibility = "hidden";
			albumContainer.classList.add("is-blurred");
			np_album.onload = null;
			np_album.onerror = null;
			np_album.src = BLANK_PIXEL;
			void albumContainer.offsetWidth;
			const nextPic = active_song.picture;
			np_album.onload = function() {
				if (loadToken !== albumLoadToken) return;
				albumReady = true;
				if (guessing)
				{
					albumContainer.classList.add("is-blurred");
				}
				else
				{
					albumContainer.classList.remove("is-blurred");
				}
				np_album.style.visibility = "visible";
			};
			np_album.onerror = function() {
				if (loadToken !== albumLoadToken) return;
				albumReady = true;
				np_album.style.visibility = "visible";
			};
			np_album.src = nextPic;
			if (np_album.complete && np_album.naturalWidth > 1 && np_album.src !== BLANK_PIXEL)
			{
				albumReady = true;
				np_album.style.visibility = "visible";
			}
			document.getElementById("tl-container").classList.add("is-guessing");
			document.getElementById("tlHint").textContent = (years.length === 0) ? "Click + to place the first track" : "Click a + slot to place this track";

			document.getElementById("song-data").style.display = 'none';

			audio.src = active_song.link;
			resetTimelinePlayerUI();
		}

		function redrawTimeline() {
			document.getElementById("song-data").style.display = '';
			const titleEl = document.getElementById("song-title");
			const artistEl = document.getElementById("song-artist");
			titleEl.innerText = active_song.title;
			titleEl.title = active_song.title;
			artistEl.innerText = active_song.artist;
			artistEl.title = active_song.artist;
			document.getElementById("song-year").innerText = active_song.year;

			let correctGuess = false;
			if (years.length == 0)
			{
				correctGuess = true;
			}
			else if (insert_index == 0)
			{
				correctGuess = (active_song.year <= years[0]);
			}
			else if (insert_index == years.length)
			{
				correctGuess = (active_song.year >= years[years.length - 1]);
			}
			else
			{
				correctGuess = (active_song.year >= years[insert_index - 1]) && (active_song.year <= years[insert_index]);
			}
			if (correctGuess)
			{
				albums.splice(insert_index, 0, active_song.picture);
				years.splice(insert_index, 0, active_song.year);
			}
			else
			{
				wrongAnswers++;
				document.getElementById("wrong-answer-" + wrongAnswers).innerHTML = MELODLE_ICONS.x;
			}

			document.getElementById("tlCount").textContent = String(years.length);

			const isGameOver = (wrongAnswers == 5 || years.length == 10);
			if (isGameOver)
			{
				next.style.display = 'none';
				document.getElementById("wrong-answer-boxes").style.display = 'none';

				restart.style.display = '';
				win.style.display = (years.length == 10) ? '' : 'none';
				lose.style.display = (wrongAnswers == 5) ? '' : 'none';
				document.getElementById("tlHint").textContent = "";
			}
			else
			{
				document.getElementById("tlHint").textContent = "Click Next to draw another track";
			}

			guessing = false;
			albumContainer.classList.remove("is-blurred");
			if (albumReady)
			{
				np_album.style.visibility = "visible";
			}

			let timeline = document.getElementById("tl-container");
			timeline.classList.remove("is-guessing");
			timeline.innerHTML = "";

			let spacer = document.createElement("div");
			spacer.classList.add("node");
			timeline.appendChild(spacer);

			for (let i = 0; i < albums.length; i++)
			{
				let album = albums[i];
				let year = years[i];

				let aContainer = document.createElement("div");
				aContainer.classList.add("a-container");
				let aElem = document.createElement("img");
				aElem.src = album;
				aElem.alt = "Song from " + year;
				aElem.classList.add("album-art");
				let aDate = document.createElement("text");
				aDate.innerText = year;
				aContainer.appendChild(aElem);
				aContainer.appendChild(aDate);
				timeline.appendChild(aContainer);

				spacer = document.createElement("div");
				spacer.classList.add("node");
				timeline.appendChild(spacer);
			}

			const elements = document.querySelectorAll(".node");
			let nodeVal = -1;

			elements.forEach(element => {
				const slotIdx = ++nodeVal;
				let pill = document.createElement("span");
				pill.classList.add("node-pill");
				pill.innerHTML = MELODLE_ICONS.plus;
				element.appendChild(pill);
				element.onclick = function() {
					if (!guessing) return;
					insert_index = slotIdx;
					redrawTimeline();
				};
			});
		}

		function shuffle(array) {
			for (var i = array.length - 1; i >= 0; i--) {
				var j = Math.floor(Math.random() * (i + 1));
				var temp = array[i];
				array[i] = array[j];
				array[j] = temp;
			}
		}
	</script>
</body>

</html>
