<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Melodle Billboard — Guess the Billboard Hot 100 Top 10 from any historical chart week since 1958.">
	<title>Melodle Billboard</title>
	<link rel="icon" type="image/png" href="img/logo.png">
	<script>(function(){try{var t=localStorage.getItem('melodle-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<nav class="mode-nav" aria-label="Game modes">
		<a href="index.html">Daily Melodle</a>
		<a href="quiz.html">Song Quiz</a>
		<a href="billboard.html" class="active">Billboard</a>
		<a href="topsongs.html">Top Songs</a>
		<a href="timeline.html">Timeline</a>
		<div class="nav-divider"></div>
		<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle color theme">Dark Mode</button>
	</nav>
	<div class="container billboard-container">
		<header class="masthead" id="title-row">
			<img src="img/logo.png" class="masthead-logo" alt="Melodle logo">
			<h1 id="title">Melodle Billboard</h1>
		</header>

		<div class="billboard-layout" id="main-columns">
			<div class="billboard-sidebar" id="main-column-1">
				<div class="cotd-badge" id="main-section-0">
					<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
					<span>Chart of the Day</span>
					<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
				</div>
				<div class="billboard-date-card" id="main-section-1">
					<div id="current_date"></div>
					<div class="billboard-modals">
						<div class="date-picker-wrap is-disabled" id="chartDateWrap" aria-disabled="true" title="Pick a chart date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><input type="hidden" class="date-picker" id="chart_date" min="1958-08-04" aria-label="Pick a chart date"/></div>
						<div class="modals-subcontainer">
							<label class="switch">
								<input type="checkbox" id="difficulty">
								<span class="slider round"></span>
							</label>
							<div>Easy Mode</div>
						</div>
					</div>
				</div>
				<div class="billboard-volume-row">
					<div class="slider-container" id="volume-container">
						<button type="button" class="volume-btn" onclick="incrementVolume(-10)" aria-label="Decrease volume" title="Decrease volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg></button>
						<input type="range" min="0" max="100" value="80" class="volume-slider" id="volume-slider" step="1" aria-label="Volume">
						<button type="button" class="volume-btn" onclick="incrementVolume(10)" aria-label="Increase volume" title="Increase volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
					</div>
				</div>
				<div id="main-section-2">
					<div class="auto-container" autocomplete="off">
						<div class="autocomplete autocomplete-up">
							<input id="myInput" type="text" name="myInput" placeholder="Type a song name ...">
							<button type="button" class="submit" onclick="checkAnswer()" aria-label="Submit guess"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
						</div>
					</div>
				</div>
				<div class="gameover-stack" id="game-over-stack">
					<div id="game-over-section-1">
						<b>GAME OVER</b>
					</div>
					<div id="game-over-section-2">
						0 of 10 songs found.
					</div>
				</div>
				<div class="billboard-strikes-row" id="main-section-3">
					<div id="wrong-answer-boxes">
						<div class="wrong-answer" id="wrong-answer-1"></div>
						<div class="wrong-answer" id="wrong-answer-2"></div>
						<div class="wrong-answer" id="wrong-answer-3"></div>
						<div class="wrong-answer" id="wrong-answer-4"></div>
						<div class="wrong-answer" id="wrong-answer-5"></div>
					</div>
					<button type="button" class="btn-danger-outline giveUpBtn" id="giveUpBtn" onclick="giveUp()" disabled>Give Up</button>
				</div>
			</div>
			<div id="main-column-2">
				<div class="billboard-tracklist" id="main-section-4">
					<div class="track-slot billboard-slot" id="slot1"><span class="num-box" id="num1">1.</span><div class="guess-box" id="guess1"></div></div>
					<div class="track-slot billboard-slot" id="slot2"><span class="num-box" id="num2">2.</span><div class="guess-box" id="guess2"></div></div>
					<div class="track-slot billboard-slot" id="slot3"><span class="num-box" id="num3">3.</span><div class="guess-box" id="guess3"></div></div>
					<div class="track-slot billboard-slot" id="slot4"><span class="num-box" id="num4">4.</span><div class="guess-box" id="guess4"></div></div>
					<div class="track-slot billboard-slot" id="slot5"><span class="num-box" id="num5">5.</span><div class="guess-box" id="guess5"></div></div>
					<div class="track-slot billboard-slot" id="slot6"><span class="num-box" id="num6">6.</span><div class="guess-box" id="guess6"></div></div>
					<div class="track-slot billboard-slot" id="slot7"><span class="num-box" id="num7">7.</span><div class="guess-box" id="guess7"></div></div>
					<div class="track-slot billboard-slot" id="slot8"><span class="num-box" id="num8">8.</span><div class="guess-box" id="guess8"></div></div>
					<div class="track-slot billboard-slot" id="slot9"><span class="num-box" id="num9">9.</span><div class="guess-box" id="guess9"></div></div>
					<div class="track-slot billboard-slot" id="slot10"><span class="num-box" id="num10">10.</span><div class="guess-box" id="guess10"></div></div>
				</div>
			</div>
		</div>

		<div id="player-audio">
			<audio controls class="hidden-item" id="audio"></audio>
		</div>
	</div>

	<script src="theme.js"></script>
	<script type="text/javascript">
		var timestamps = [];
		var timer = 4000;
		var totalSongs = 10;
		var wrongAnswers = 0;

		let timeRunning = null;
		let playbackToken = 0;
		let pendingLoadToken = -1;
		let clipOriginSec = 0;
		let clipStartSec = 0;
		let clipTotalSec = 4;
		let clipEndTime = null;
		let clipRafId = null;
		let clipPlaying = false;
		const RING_CIRCUMFERENCE = 2 * Math.PI * 9;

		let json_top10 = [];
		let dates = [];

		let date = new Date();
		let activePickedDateStr = "";
		let dailyPickedDateStr = "";
		let songs = [];
		let songLinkByName = new Map();
		let namesByLink = new Map();
		let artistBySong = new Map();
		let guessedSongs = new Set();
		let quizSongs = [ null, null, null, null, null, null, null, null, null, null ];
		let quizNames = [ null, null, null, null, null, null, null, null, null, null ];
		let quizLinks = [ null, null, null, null, null, null, null, null, null, null ];

		let songVal = -1;

		/*
		document.addEventListener('visibilitychange', function() {
			if (document.visibilityState == 'hidden') {
				document.getElementById("pause-button").click();
			}
		});
		*/

		document.addEventListener("DOMContentLoaded", async function() {
			try {
				const response = await fetch('./jsons/data/top_10s_linked.json');
				json_top10 = await response.json();
			}
			catch(error) {
				console.error('Error:', error);
			}

			try {
				const response = await fetch('./jsons/data/chart_dates.json');
				datesJSON = await response.json();
				dates = datesJSON.dates;
			}
			catch(error) {
				console.error('Error:', error);
			}

			const todayMaxStr = formatLocalDate(new Date());
			const lastChartMaxStr = dates.length ? dates[dates.length - 1] : todayMaxStr;
			chart_date.max = (todayMaxStr > lastChartMaxStr) ? todayMaxStr : lastChartMaxStr;
			
			const seenSongNames = new Set();
			for (const entry of json_top10)
			{
				const fullName = entry.title + ' - ' + entry.artist;
				if (!seenSongNames.has(fullName))
				{
					seenSongNames.add(fullName);
					songs.push(fullName);
					if (entry.artist)
					{
						artistBySong.set(fullName, entry.artist);
					}
				}
				if (entry.link)
				{
					if (!songLinkByName.has(fullName))
					{
						songLinkByName.set(fullName, entry.link);
					}
					if (!namesByLink.has(entry.link))
					{
						namesByLink.set(entry.link, new Set());
					}
					namesByLink.get(entry.link).add(fullName);
				}
			}

			songs.sort(sortBySongName);
			autocomplete(document.getElementById("myInput"), songs);
			setVolume();

			quizYear = getRandomNumberFromDate();
			const maxDayInMonth = new Date(quizYear, date.getMonth() + 1, 0).getDate();
			date = new Date(quizYear, date.getMonth(), Math.min(date.getDate(), maxDayInMonth));
			createTopTen();
			const chartDateWrap = document.getElementById("chartDateWrap");
			if (chartDateWrap && dates.length)
			{
				chartDateWrap.classList.remove("is-disabled");
				chartDateWrap.removeAttribute("aria-disabled");
			}
		});

		audio.addEventListener("loadedmetadata", function() {
			const token = pendingLoadToken;
			pendingLoadToken = -1;
			if (token !== playbackToken) return;
			playClip(token);
		});

		audio.addEventListener("timeupdate", function() {
			if (clipEndTime !== null && !audio.paused && !audio.seeking && audio.currentTime >= clipEndTime)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("ended", function() {
			clipPlaying = false;
			cancelClipMonitor();
			if (songVal != -1) flipIcons(false);
		});

		audio.addEventListener("error", function() {
			if (audio.getAttribute("src"))
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("pause", function() {
			if (pendingLoadToken === -1 && clipPlaying && !audio.ended && !audio.seeking)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		document.getElementById("volume-slider").addEventListener("input", function() {
			setVolume();
		});

		function setVolume() {
			audio.volume = document.getElementById("volume-slider").value / 100;
		}

		function incrementVolume(i) {
			const slider = document.getElementById("volume-slider");
			let vol = parseInt(slider.value, 10) + i;
			if (vol > Number(slider.max)) vol = Number(slider.max);
			if (vol < Number(slider.min)) vol = Number(slider.min);
			slider.value = vol;
			setVolume();
		}

		difficulty.addEventListener("change", function() {
			if (songVal === -1 || audio.paused) return;
			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipEndTime = null;
				clipStartSec = clipOriginSec;
				clipTotalSec = Math.max(0.1, dur - clipOriginSec);
				if (clipRafId === null)
				{
					monitorClipProgress(playbackToken);
				}
			}
			else
			{
				const clipSec = timer / 1000;
				const endSec = Math.min(clipOriginSec + clipSec, dur - 0.03);
				if (audio.currentTime < endSec)
				{
					clipStartSec = clipOriginSec;
					clipEndTime = endSec;
					clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
					if (clipRafId === null)
					{
						monitorClipProgress(playbackToken);
					}
				}
				else
				{
					pausePlayback();
					flipIcons(false);
				}
			}
		});

		function formatLocalDate(d) {
			const yr = d.getFullYear();
			const mo = String(d.getMonth() + 1).padStart(2, '0');
			const dy = String(d.getDate()).padStart(2, '0');
			return `${yr}-${mo}-${dy}`;
		}

		chart_date.onchange = function() {
			if (!chart_date.value || !dates.length) return;
			const parts = chart_date.value.split('-');
			const picked = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
			if (isNaN(picked.getTime())) return;
			date = picked;
			createTopTen();
		}

		function flipIcons(startingPlayback = true) {
			if (songVal < 0) return;
			const wrap = document.getElementById("pauseWrap" + (songVal + 1));
			const spk = document.getElementById("speaker" + (songVal + 1));
			const fg = document.getElementById("ringFg" + (songVal + 1));
			if (fg) fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
			if (wrap) wrap.style.display = startingPlayback ? 'inline-flex' : 'none';
			if (spk) spk.style.display = startingPlayback ? 'none' : '';
			const slot = document.getElementById("slot" + (songVal + 1));
			if (slot) slot.classList.toggle("is-playing", Boolean(startingPlayback));
		}

		function cancelClipMonitor() {
			playbackToken++;
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearTimeout(timeRunning);
			timeRunning = null;
		}

		function monitorClipProgress(token) {
			if (token !== playbackToken || !clipPlaying || songVal < 0)
			{
				return;
			}
			if (!audio.paused && !audio.seeking)
			{
				const fg = document.getElementById("ringFg" + (songVal + 1));
				if (fg && clipTotalSec > 0)
				{
					const frac = Math.max(0, Math.min(1, (audio.currentTime - clipStartSec) / clipTotalSec));
					fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - frac));
				}
				if (clipEndTime !== null && audio.currentTime >= clipEndTime)
				{
					pausePlayback();
					if (songVal != -1) flipIcons(false);
					return;
				}
			}
			clipRafId = requestAnimationFrame(function() {
				monitorClipProgress(token);
			});
		}

		function loadClip(link, i) {
			if (songVal != -1 && songVal != i)
			{
				flipIcons(false);
			}

			cancelClipMonitor();
			pendingLoadToken = playbackToken;
			songVal = i;
			flipIcons(true);
			audio.src = link;
			audio.load();
		}

		function playClip(token) {
			if (token !== playbackToken) return;
			flipIcons(true);
			const onPlayError = function(err) {
				if (token === playbackToken && (!err || err.name !== "AbortError"))
				{
					pausePlayback();
					if (songVal != -1) flipIcons(false);
				}
			};

			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipOriginSec = 0;
				clipStartSec = 0;
				clipEndTime = null;
				clipTotalSec = dur;
				audio.currentTime = 0;
				clipPlaying = true;
				const playPromise = audio.play();
				if (playPromise && typeof playPromise.catch === "function")
				{
					playPromise.catch(onPlayError);
				}
				monitorClipProgress(token);
			}
			else
			{
				const clipSec = timer / 1000;
				const maxStart = Math.max(0, dur - clipSec);
				const startSec = Math.min(timestamps[songVal] || 0, maxStart);
				clipOriginSec = startSec;
				clipStartSec = startSec;
				clipEndTime = Math.min(startSec + clipSec, dur - 0.03);
				clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);

				audio.currentTime = startSec;
				clipPlaying = true;
				const playPromise = audio.play();
				if (playPromise && typeof playPromise.catch === "function")
				{
					playPromise.catch(onPlayError);
				}
				monitorClipProgress(token);
			}
		}

		function pausePlayback() {
			clipPlaying = false;
			cancelClipMonitor();
			pendingLoadToken = -1;
			audio.pause();
		}

		async function createTopTen() {
			if (!dates.length || isNaN(date.getTime())) return;

			const minDateStr = dates[0];
			const maxChartDateStr = dates[dates.length - 1];
			const todayStr = formatLocalDate(new Date());
			const maxPickerDateStr = (todayStr > maxChartDateStr) ? todayStr : maxChartDateStr;

			let pickedDateStr = formatLocalDate(date);
			if (pickedDateStr < minDateStr)
			{
				const minParts = minDateStr.split('-');
				date = new Date(Number(minParts[0]), Number(minParts[1]) - 1, Number(minParts[2]));
				pickedDateStr = minDateStr;
			}
			else if (pickedDateStr > maxPickerDateStr)
			{
				const maxParts = maxPickerDateStr.split('-');
				date = new Date(Number(maxParts[0]), Number(maxParts[1]) - 1, Number(maxParts[2]));
				pickedDateStr = maxPickerDateStr;
			}

			chart_date.value = pickedDateStr;
			if (pickedDateStr === activePickedDateStr) return;
			activePickedDateStr = pickedDateStr;
			if (!dailyPickedDateStr)
			{
				dailyPickedDateStr = pickedDateStr;
			}
			document.getElementById("main-section-0").style.display = (pickedDateStr === dailyPickedDateStr) ? '' : 'none';
			resetHTML();

			let dateYear = '' + date.getFullYear();
			let dateMonth = date.toLocaleString('default', { month: 'long' });
			let dateDay = '' + date.getDate();

			current_date.innerHTML = dateMonth + " " + dateDay + "<br><div class='quiz-year'>" + dateYear + "</div>";

			const lookupDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
			let dateString = formatLocalDate(lookupDate);
			if (dateString > maxChartDateStr)
			{
				const mcParts = maxChartDateStr.split('-');
				lookupDate.setFullYear(Number(mcParts[0]), Number(mcParts[1]) - 1, Number(mcParts[2]));
				dateString = maxChartDateStr;
			}
			while (!dates.includes(dateString) && dateString > minDateStr)
			{
				lookupDate.setDate(lookupDate.getDate() - 1);
				dateString = formatLocalDate(lookupDate);
			}

			const seenEntries = new Set();
			const weekEntries = [];
			for (const entry of json_top10)
			{
				if (entry.date == dateString)
				{
					const entryKey = entry.rank + "\t" + entry.title + "\t" + entry.artist;
					if (!seenEntries.has(entryKey))
					{
						seenEntries.add(entryKey);
						weekEntries.push(entry);
					}
				}
			}
			weekEntries.sort(function(a, b) { return a.rank - b.rank; });

			if (weekEntries.length >= totalSongs)
			{
				for (let i = 0; i < totalSongs; i++)
				{
					const entry = weekEntries[i];
					quizSongs[i] = entry;
					quizNames[i] = entry.title + ' - ' + entry.artist;
					quizLinks[i] = entry.link;
					document.getElementById("num" + (i + 1)).innerText = entry.rank + ".";
				}
			}
			else
			{
				const overflow = [];
				for (const entry of weekEntries)
				{
					const idx = entry.rank - 1;
					if (idx >= 0 && idx < totalSongs && quizSongs[idx] === null)
					{
						quizSongs[idx] = entry;
						quizNames[idx] = entry.title + ' - ' + entry.artist;
						quizLinks[idx] = entry.link;
						document.getElementById("num" + (idx + 1)).innerText = entry.rank + ".";
					}
					else
					{
						overflow.push(entry);
					}
				}
				for (const entry of overflow)
				{
					const openIdx = quizSongs.indexOf(null);
					if (openIdx !== -1)
					{
						quizSongs[openIdx] = entry;
						quizNames[openIdx] = entry.title + ' - ' + entry.artist;
						quizLinks[openIdx] = entry.link;
						document.getElementById("num" + (openIdx + 1)).innerText = entry.rank + ".";
					}
				}
			}
			
			const chartRng = createSeededRng(Number(dateString.replace(/-/g, '')));
			for (let i = 0; i < quizSongs.length; i++)
			{
															// length of Spotify previews
				timestamps.push(Math.floor(chartRng() * (30 - (timer / 1000))));

				const songBox = document.getElementById("guess" + (i + 1));
				const songTitleBox = document.createElement("div");
				songTitleBox.classList.add('answer-box');
				songTitleBox.id = "answerBox" + (i + 1);
				const blankContainer = document.createElement("div");
				const blank = document.createElement("span");
				blank.id = "guessText" + (i + 1);

				const speakerIcon = document.createElement("button");
				speakerIcon.type = "button";
				speakerIcon.className = "row-speaker-btn";
				speakerIcon.id = "speaker" + (i + 1);
				speakerIcon.setAttribute("aria-label", "Play preview for rank " + (i + 1));
				speakerIcon.innerHTML = MELODLE_ICONS.speaker;
				if (!quizSongs[i] || !quizSongs[i].link)
				{
					speakerIcon.disabled = true;
					speakerIcon.title = "No audio preview available";
					if (quizSongs[i])
					{
						setFormattedSongText(blank, quizNames[i], quizSongs[i].artist);
						blank.style.opacity = "0.65";
						blank.title = "No audio preview available";
						guessedSongs.add(quizNames[i]);
					}
				}

				const pauseWrap = document.createElement("button");
				pauseWrap.type = "button";
				pauseWrap.id = "pauseWrap" + (i + 1);
				pauseWrap.classList.add("row-pause-wrap");
				pauseWrap.setAttribute("aria-label", "Pause preview for rank " + (i + 1));
				pauseWrap.innerHTML = '<svg class="clip-ring-svg" viewBox="0 0 22 22"><circle class="clip-ring-bg" cx="11" cy="11" r="9"></circle><circle class="clip-ring-fg" id="ringFg' + (i + 1) + '" cx="11" cy="11" r="9"></circle></svg><span class="row-pause-icon">' + MELODLE_ICONS.pause + '</span>';
				if (quizSongs[i] && quizSongs[i].link)
				{
					speakerIcon.onclick = function () {
						const hadFocus = (document.activeElement === speakerIcon);
						loadClip(quizSongs[i].link, i);
						if (hadFocus && pauseWrap.style.display !== "none") pauseWrap.focus();
					};
				}
				pauseWrap.onclick = function () {
					const hadFocus = (document.activeElement === pauseWrap);
					flipIcons(false);
					pausePlayback();
					if (hadFocus) speakerIcon.focus();
				};

				blankContainer.appendChild(blank);
				songTitleBox.appendChild(blankContainer);
				songTitleBox.appendChild(speakerIcon);
				songTitleBox.appendChild(pauseWrap);

				songBox.appendChild(songTitleBox);
			}
		}

		function sortBySongName(a, b) {
			return a.localeCompare(b, undefined, { sensitivity: 'base' });
		}

		function giveUp() {
			if (!quizSongs.some(Boolean)) return;
			pausePlayback();
			if (songVal != -1)
			{
				flipIcons(false);
			}
			let validSongs = 0;
			let songsFound = 0;

			for (let i = 0; i < totalSongs; i++)
			{
				if (!quizSongs[i] || !quizSongs[i].link) continue;
				validSongs++;
				let songTitleText = document.getElementById("guessText" + (i + 1));

				if (songTitleText.innerText == "")
				{
					setFormattedSongText(songTitleText, quizNames[i], quizSongs[i].artist);
					songTitleText.classList.add("missed-song-text");
					const slot = document.getElementById("slot" + (i + 1));
					if (slot) slot.classList.add("is-missed");
				}
				else
				{
					songsFound++;
				}
			}

			const isWin = (validSongs > 0 && songsFound === validSongs);
			const go1 = document.getElementById("game-over-section-1");
			go1.innerHTML = isWin ? "<b>YOU WIN</b>" : "<b>GAME OVER</b>";
			go1.style.display = 'block';
			document.getElementById("game-over-section-2").style.display = 'block';
			document.getElementById("game-over-stack").style.display = 'flex';
			document.getElementById("main-section-2").style.display = 'none';
			document.getElementById("main-section-3").style.display = 'none';
			document.getElementById("game-over-section-2").innerText = "" + songsFound + " of " + validSongs + " songs found.";
			document.getElementById("giveUpBtn").disabled = true;
		}

		function checkAnswer() {
			input = document.getElementById('myInput').value;

			if (songs.includes(input))
			{
				document.getElementById('myInput').value = '';
				if (guessedSongs.has(input))
				{
					return;
				}
				guessedSongs.add(input);

				let matchIdx = quizNames.indexOf(input);
				if (matchIdx === -1)
				{
					const guessedLink = songLinkByName.get(input);
					if (guessedLink)
					{
						for (let i = 0; i < totalSongs; i++)
						{
							if (quizSongs[i] && quizSongs[i].link === guessedLink && document.getElementById("guessText" + (i + 1)).innerText == "")
							{
								matchIdx = i;
								break;
							}
						}
					}
				}
				if (matchIdx !== -1)
				{
					const matchedName = quizNames[matchIdx];
					guessedSongs.add(matchedName);
					setFormattedSongText(
						document.getElementById("guessText" + (matchIdx + 1)),
						matchedName,
						quizSongs[matchIdx] ? quizSongs[matchIdx].artist : undefined
					);
					const slot = document.getElementById("slot" + (matchIdx + 1));
					if (slot) slot.classList.add("is-solved");
					const matchedLink = quizSongs[matchIdx] && quizSongs[matchIdx].link;
					if (matchedLink && namesByLink.has(matchedLink))
					{
						let anotherRowUsesLink = false;
						for (let j = 0; j < totalSongs; j++)
						{
							if (j !== matchIdx && quizSongs[j] && quizSongs[j].link === matchedLink && document.getElementById("guessText" + (j + 1)).innerText == "")
							{
								anotherRowUsesLink = true;
								break;
							}
						}
						if (!anotherRowUsesLink)
						{
							namesByLink.get(matchedLink).forEach(function(siblingName) {
								guessedSongs.add(siblingName);
							});
						}
					}

					l1: while (true)
					{
						for (let i = 0; i < totalSongs; i++)
						{
							if (quizSongs[i] && document.getElementById("guessText" + (i + 1)).innerText == "")
							{
								break l1;
							}
						}

						const go1 = document.getElementById("game-over-section-1");
						go1.innerHTML = "<b>YOU WIN</b>";
						go1.style.display = 'block';
						document.getElementById("game-over-section-2").style.display = 'block';
						document.getElementById("game-over-stack").style.display = 'flex';
						document.getElementById("main-section-2").style.display = 'none';
						document.getElementById("main-section-3").style.display = 'none';
						document.getElementById("game-over-section-2").innerText = "All songs found!";
						document.getElementById("giveUpBtn").disabled = true;
						break
					}
				}
				else
				{
					wrongAnswers++;
					document.getElementById("wrong-answer-" + wrongAnswers).innerHTML = MELODLE_ICONS.x;

					if (wrongAnswers == 5)
					{
						giveUp();
					}
				}
			}
		}

		function parseStringToJsonToArrays(str) {
			const fileJSON = JSON.parse(str.toString());

			tmpArr = [];

			for (let i of fileJSON)
			{
				if (i.trackLink)
				{
					tmpArr.push([i.title + " - " + i.artist, i.preview.replace("\\/", "/"), i.trackLink.replace("\\/", "/")]);
				}
			}

			return tmpArr;
		}

		function resetHTML() {
			clipPlaying = false;
			cancelClipMonitor();
			pendingLoadToken = -1;
			audio.pause();
			songVal = -1;
			
			timestamps = [];
			
			wrongAnswers = 0;
			guessedSongs.clear();

			document.getElementById("myInput").value = "";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });

			for (let i = 1; i <= 5; i++)
			{
				document.getElementById("wrong-answer-" + i).innerHTML = "";
			}

			quizSongs = [ null, null, null, null, null, null, null, null, null, null ];
			quizNames = [ null, null, null, null, null, null, null, null, null, null ];
			quizLinks = [ null, null, null, null, null, null, null, null, null, null ];

			for (let i = 0; i < totalSongs; i++)
			{
				document.getElementById("num" + (i + 1)).innerText = (i + 1) + ".";
				songBox = document.getElementById("guess" + (i + 1));
				songBox.innerHTML = "";
				const slot = document.getElementById("slot" + (i + 1));
				if (slot) slot.className = "track-slot billboard-slot";
			}

			document.getElementById("game-over-stack").style.display = 'none';
			document.getElementById("game-over-section-1").style.display = 'none';
			document.getElementById("game-over-section-2").style.display = 'none';
			document.getElementById("main-section-2").style.display = '';
			document.getElementById("main-section-3").style.display = '';

			document.getElementById("giveUpBtn").disabled = false;
		}

		function createSeededRng(initialSeed) {
			let s = initialSeed | 0;
			return function() {
				s = (s + 0x6D2B79F5) | 0;
				let t = Math.imul(s ^ (s >>> 15), 1 | s);
				t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
				return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
			};
		}

		function generateSeededRandom(seed) {
			return createSeededRng(seed)();
		}

		function getRandomNumberFromDate() {
			const now = new Date();
			let min = 1958;
			if (now.getMonth() < 7 || (now.getMonth() === 7 && now.getDate() < 4))
			{
				min = 1959;
			}
			let max = now.getFullYear();
			if (dates.length)
			{
				const lastDateStr = dates[dates.length - 1];
				const lastParts = lastDateStr.split('-');
				const lastYear = Number(lastParts[0]);
				const maxLastYrDay = new Date(lastYear, now.getMonth() + 1, 0).getDate();
				const candidateThisLastYear = formatLocalDate(new Date(lastYear, now.getMonth(), Math.min(now.getDate(), maxLastYrDay)));
				max = (candidateThisLastYear <= lastDateStr) ? lastYear : (lastYear - 1);
			}
			const date_string_int = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
			
			const range = max - min;
			const random = generateSeededRandom(date_string_int);
			const random_year = Math.floor(random * (range + 1)) + min;

			return random_year;
		}

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				searchResults = 0;
				for (i = 0; i < arr.length; i++) {
					if (!guessedSongs.has(arr[i]) && arr[i].toUpperCase().includes(val.toUpperCase())) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = buildAutocompleteItem(itemValue, val, artistBySong.get(itemValue));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						searchResults++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}
	</script>
