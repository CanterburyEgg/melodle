<head>

	<script>(function(){try{var t=localStorage.getItem('melodle-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>

</head>

<body>

				<div class="transport-btns">
					<button type="button" class="icon-btn" id="prev-button" onclick="incrementSong(-1)" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>

					<button type="button" class="icon-btn primary" id="play-button" onclick="loadAudio()" aria-label="Play sequence" title="Play sequence"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"></polygon></svg></button>
					<button type="button" class="icon-btn primary" id="pause-button" onclick="pausePlayback()" aria-label="Pause" title="Pause"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4.5" height="16" rx="1"></rect><rect x="13.5" y="4" width="4.5" height="16" rx="1"></rect></svg></button>

				<button type="button" class="volume-btn" onclick="incrementVolume(-10)" aria-label="Decrease volume" title="Decrease volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg></button>

				</div>

			<div class="modals-subcontainer" id="difficulty-container">
				<label class="switch">
					<input type="checkbox" id="difficulty">
					<span class="slider round"></span>
				</label>
				<div>Easy Mode</div>
			</div>
		</div>

		<div class="quiz-gameover-row" id="quiz-game-over-row">
			<div class="gameover-stack">
				<div id="game-over-section-1">
					<b>GAME OVER</b>
				</div>
				<div id="game-over-section-2">
					? of 30 songs identified.
				</div>

		</div>

		<div class="quiz-strikes-row" id="main-section-3">
			<div id="wrong-answer-boxes">
				<div class="wrong-answer" id="wrong-answer-1"></div>
				<div class="wrong-answer" id="wrong-answer-2"></div>

			</div>
			<button type="button" class="btn-danger-outline giveUpBtn" id="giveUpBtn" onclick="giveUp()">Give Up</button>
		</div>

		<div id="main-section-4">
			<div class="quiz-columns-grid">
				<div class="quiz-col">
					<div class="track-slot" id="slot1"><span class="num-box" id="num1">1.</span><div class="guess-box" id="guess1"></div></div>
					<div class="track-slot" id="slot2"><span class="num-box" id="num2">2.</span><div class="guess-box" id="guess2"></div></div>
					<div class="track-slot" id="slot3"><span class="num-box" id="num3">3.</span><div class="guess-box" id="guess3"></div></div>
					<div class="track-slot" id="slot4"><span class="num-box" id="num4">4.</span><div class="guess-box" id="guess4"></div></div>
					<div class="track-slot" id="slot5"><span class="num-box" id="num5">5.</span><div class="guess-box" id="guess5"></div></div>
					<div class="track-slot" id="slot6"><span class="num-box" id="num6">6.</span><div class="guess-box" id="guess6"></div></div>
					<div class="track-slot" id="slot7"><span class="num-box" id="num7">7.</span><div class="guess-box" id="guess7"></div></div>
					<div class="track-slot" id="slot8"><span class="num-box" id="num8">8.</span><div class="guess-box" id="guess8"></div></div>
					<div class="track-slot" id="slot9"><span class="num-box" id="num9">9.</span><div class="guess-box" id="guess9"></div></div>
					<div class="track-slot" id="slot10"><span class="num-box" id="num10">10.</span><div class="guess-box" id="guess10"></div></div>
				</div>
				<div class="quiz-col">
					<div class="track-slot" id="slot11"><span class="num-box" id="num11">11.</span><div class="guess-box" id="guess11"></div></div>
					<div class="track-slot" id="slot12"><span class="num-box" id="num12">12.</span><div class="guess-box" id="guess12"></div></div>
					<div class="track-slot" id="slot13"><span class="num-box" id="num13">13.</span><div class="guess-box" id="guess13"></div></div>
					<div class="track-slot" id="slot14"><span class="num-box" id="num14">14.</span><div class="guess-box" id="guess14"></div></div>
					<div class="track-slot" id="slot15"><span class="num-box" id="num15">15.</span><div class="guess-box" id="guess15"></div></div>
					<div class="track-slot" id="slot16"><span class="num-box" id="num16">16.</span><div class="guess-box" id="guess16"></div></div>
					<div class="track-slot" id="slot17"><span class="num-box" id="num17">17.</span><div class="guess-box" id="guess17"></div></div>
					<div class="track-slot" id="slot18"><span class="num-box" id="num18">18.</span><div class="guess-box" id="guess18"></div></div>
					<div class="track-slot" id="slot19"><span class="num-box" id="num19">19.</span><div class="guess-box" id="guess19"></div></div>
					<div class="track-slot" id="slot20"><span class="num-box" id="num20">20.</span><div class="guess-box" id="guess20"></div></div>
				</div>
				<div class="quiz-col">
					<div class="track-slot" id="slot21"><span class="num-box" id="num21">21.</span><div class="guess-box" id="guess21"></div></div>
					<div class="track-slot" id="slot22"><span class="num-box" id="num22">22.</span><div class="guess-box" id="guess22"></div></div>
					<div class="track-slot" id="slot23"><span class="num-box" id="num23">23.</span><div class="guess-box" id="guess23"></div></div>
					<div class="track-slot" id="slot24"><span class="num-box" id="num24">24.</span><div class="guess-box" id="guess24"></div></div>
					<div class="track-slot" id="slot25"><span class="num-box" id="num25">25.</span><div class="guess-box" id="guess25"></div></div>
					<div class="track-slot" id="slot26"><span class="num-box" id="num26">26.</span><div class="guess-box" id="guess26"></div></div>
					<div class="track-slot" id="slot27"><span class="num-box" id="num27">27.</span><div class="guess-box" id="guess27"></div></div>
					<div class="track-slot" id="slot28"><span class="num-box" id="num28">28.</span><div class="guess-box" id="guess28"></div></div>
					<div class="track-slot" id="slot29"><span class="num-box" id="num29">29.</span><div class="guess-box" id="guess29"></div></div>
					<div class="track-slot" id="slot30"><span class="num-box" id="num30">30.</span><div class="guess-box" id="guess30"></div></div>
				</div>
			</div>
		</div>

		<div id="player-iframe">
			<audio controls class="hidden-item" id="audio"></audio>
			<button type="button" class="hidden-item" id="hiddenPlayBtn"></button>
			<div id="embed-iframe"></div>
		</div>
	</div>

	<script src="theme.js"></script>
	<script type="text/javascript">
		var quizLinks = [];
		var songLinks = [];
		var quizSongs = [];
		var timestamps = [];
		var songs = [];
		var timer = 4000;
		var songVal = 0;
		var clipIndex = 0;
		var totalSongs = 30;
		var wrongAnswers = 0;
		var seed = 0;
		var playing = false;
		var buffering = false;

		let timeRunning = null;
		let firstQuiz = true;
		let playbackToken = 0;
		let pendingLoadToken = -1;
		let clipEndTime = null;
		let clipOriginSec = 0;
		let clipStartSec = 0;
		let clipTotalSec = 4;
		let activeRowIndex = -1;
		let quizEmbedController = null;
		let embedIsPlaying = false;
		let embedPauseIgnoreUntil = 0;
		let quizTitles = [];
		let quizGeneration = 0;
		const RING_CIRCUMFERENCE = 2 * Math.PI * 9;
		let clipRafId = null;
		let guessedSongs = new Set();
		let artistBySong = new Map();
		const preloadAudio = new Audio();
		preloadAudio.preload = "auto";

		window.onSpotifyIframeApiReady = (IFrameAPI) => {
			const element = document.getElementById('embed-iframe');
			const options = {
				width: '100%',
				height: 152
			};
			const callback = (EmbedController) => {
				quizEmbedController = EmbedController;
				EmbedController.addListener('playback_update', function(e) {
					if (!e || !e.data) return;
					embedIsPlaying = !e.data.isPaused;
					if (e.data.isPaused)
					{
						embedPauseIgnoreUntil = 0;
						return;
					}
					if (performance.now() < embedPauseIgnoreUntil) return;
					if (playing || activeRowIndex !== -1)
					{
						pausePlayback();
					}
				});
				document.querySelectorAll('#hiddenPlayBtn').forEach(
					hiddenPlayBtn => {
						hiddenPlayBtn.addEventListener('click', () => {
							pausePlayback();
							if (songLinks[songVal]) {
								EmbedController.loadUri(songLinks[songVal]);
							}
						});
					}
				);
				if (document.getElementById("giveUpBtn").disabled && songLinks[songVal])
				{
					EmbedController.loadUri(songLinks[songVal]);
				}
			};

			IFrameAPI.createController(element, options, callback);
		};

		function pauseQuizEmbed() {
			if (quizEmbedController && typeof quizEmbedController.pause === "function")
			{
				if (embedIsPlaying)
				{
					embedPauseIgnoreUntil = performance.now() + 1000;
				}
				quizEmbedController.pause();
			}
		}

		document.addEventListener('visibilitychange', function() {
			if (document.visibilityState == 'hidden') {
				document.getElementById("pause-button").click();
				pauseQuizEmbed();
			}
		});

		document.addEventListener("DOMContentLoaded", async function() {
			var jsonList = '';
			try {
				const response = await fetch('./jsons/names-to-jsons.txt');
				jsonList = await response.text();
			}
			catch(error) {
				console.error('Error:', error);
			}

			tmp = jsonList.split('\n');
			jsonList = [];
			for (let i = 0; i < tmp.length; i++)
			{
				const line = tmp[i].trim();
				if (!line) continue;
				const cols = line.split('\t').map(function(c) { return c.trim(); });
				if (cols.length >= 3) jsonList.push(cols);
			}

			let categories = [];
			for (const json of jsonList)
			{
				category = json[2];
				if (!categories.includes(category))
				{
					categories.push(category);
				}
			}

			let catsToElems = [];
			for (const cat of categories)
			{
				const ele = document.createElement("div");
				ele.classList.add("checkbox-category");
				ele.id = "category-" + cat.toLowerCase().replace(' ','-');

				catsToElems.push([cat, ele]);
			}

			for (let i = 0; i < jsonList.length; i++)
			{
				const checkboxSet = document.createElement("div");
				checkboxSet.id = "checkboxSet" + i;
				checkboxSet.classList.add("checkbox-set");

				const checkbox = document.createElement("input");
				checkbox.type = "checkbox";
				checkbox.id = jsonList[i][0];

				if (i == 0)
				{
					checkbox.checked = true;
				}

				const label = document.createElement("label");
				label.htmlFor = jsonList[i][0];
				label.textContent = jsonList[i][1];

				checkboxSet.appendChild(checkbox);
				checkboxSet.appendChild(label);

				for (const cat of catsToElems)
				{
					if (cat[0] == jsonList[i][2].replace('\r',''))
					{
						cat[1].appendChild(checkboxSet);
					}
				}
			}

			for (const cat of catsToElems)
			{
				const group = document.createElement("div");
				group.classList.add("category-group");
				const title = document.createElement("div");
				title.classList.add("category-title");
				title.innerText = cat[0];

				group.appendChild(title);
				group.appendChild(cat[1]);
				document.getElementById("checkboxes").appendChild(group);
			}

			document.getElementById("checkboxes").addEventListener("change", updateNewQuizBtn);
			updateNewQuizBtn();

			generateSeed();
			setVolume();
			createSongQuiz();
			toggleButtons();
			firstQuiz = false;
		});

		function updateNewQuizBtn() {
			const checkedCount = document.querySelectorAll('#checkboxes input[type="checkbox"]:checked').length;
			document.getElementById("newQuizBtn").disabled = (checkedCount === 0);
			document.getElementById("newSeedBtn").disabled = (checkedCount === 0);
		}

		audio.addEventListener("loadedmetadata", function() {
			const token = pendingLoadToken;
			pendingLoadToken = -1;
			if (token !== playbackToken) return;
			if (playing)
			{
				startPlayback(token);
			}
			else
			{
				playClip(token);
			}
		});

		audio.addEventListener("timeupdate", function() {
			if (clipEndTime !== null && !audio.paused && !audio.seeking && audio.currentTime >= clipEndTime)
			{
				finishCurrentClip(playbackToken);
			}
		});

		audio.addEventListener("ended", function() {
			if (playing || clipEndTime !== null || activeRowIndex !== -1)
			{
				finishCurrentClip(playbackToken);
			}
		});

		audio.addEventListener("error", function() {
			if (audio.getAttribute("src"))
			{
				pausePlayback();
			}
		});

		audio.addEventListener("pause", function() {
			if (pendingLoadToken === -1 && activeRowIndex !== -1 && !audio.ended && !audio.seeking)
			{
				pausePlayback();
			}
		});

		difficulty.addEventListener("change", function() {
			if (activeRowIndex === -1 || audio.paused) return;
			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipEndTime = null;
				clipStartSec = clipOriginSec;
				clipTotalSec = Math.max(0.1, dur - clipOriginSec);
			}
			else
			{
				const clipSec = timer / 1000;
				const endSec = Math.min(clipOriginSec + clipSec, dur - 0.03);
				if (audio.currentTime < endSec)
				{
					clipStartSec = clipOriginSec;
					clipEndTime = endSec;
					clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
				}
				else
				{
					finishCurrentClip(playbackToken);
				}
			}
		});

		document.getElementById("volume-slider").addEventListener("input", function(e) {
			setVolume();
		});

		function setVolume() {
			audio.volume = document.getElementById("volume-slider").value / 100;
		}

		function incrementVolume(i) {
			let slider = document.getElementById("volume-slider");
			
			let vol = parseInt(slider.value) + i;
			if (vol > slider.max)
			{
				vol = slider.max;
			}
			if (vol < slider.min)
			{
				vol = slider.min;
			}

			slider.value = vol;
			setVolume();
		}

		let fadeoutTimer = null;
		function showNewQuizDialog(msg = "New quiz generated!") {
			dialog = document.getElementById("new-quiz-section");
			header = document.getElementById("header");
			dialog.innerHTML = "<b>" + msg + "</b>";

			if (fadeoutTimer) clearTimeout(fadeoutTimer);
			dialog.className = "dialog-visible";
			dialog.style.width = header.offsetWidth + "px";
			dialog.style.height = header.offsetHeight + "px";
			dialog.style.top = header.offsetTop + "px";
			dialog.style.left = header.offsetLeft + "px";

			fadeoutTimer = setTimeout(function() {
				dialog.className = "dialog-invisible";
			}, 2000);
		}

		function cancelClipMonitor() {
			playbackToken++;
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearTimeout(timeRunning);
			timeRunning = null;
		}

		function preloadNextTrack(idx) {
			if (idx >= 0 && idx < quizLinks.length && quizLinks[idx])
			{
				preloadAudio.src = quizLinks[idx];
			}
		}

		function showRowPlaying(idx) {
			if (activeRowIndex !== -1 && activeRowIndex !== idx)
			{
				clearRowPlaying();
			}
			activeRowIndex = idx;
			const slot = document.getElementById("slot" + (idx + 1));
			if (slot) slot.classList.add("is-playing");
			const spk = document.getElementById("speaker" + (idx + 1));
			const wrap = document.getElementById("pauseWrap" + (idx + 1));
			const fg = document.getElementById("ringFg" + (idx + 1));
			if (fg) fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
			if (spk) spk.style.display = "none";
			if (wrap) wrap.style.display = "inline-flex";
		}

		function clearRowPlaying() {
			if (activeRowIndex === -1) return;
			const idx = activeRowIndex;
			activeRowIndex = -1;
			const slot = document.getElementById("slot" + (idx + 1));
			if (slot) slot.classList.remove("is-playing");
			const spk = document.getElementById("speaker" + (idx + 1));
			const wrap = document.getElementById("pauseWrap" + (idx + 1));
			const fg = document.getElementById("ringFg" + (idx + 1));
			if (fg) fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
			if (wrap) wrap.style.display = "none";
			if (spk) spk.style.display = "";
		}

		function finishCurrentClip(token) {
			if (token !== playbackToken)
			{
				return;
			}
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearRowPlaying();
			if (playing)
			{
				const activeCount = quizSongs.length || totalSongs;
				if (songVal < activeCount - 1)
				{
					incrementSong(1);
				}
				else
				{
					pausePlayback();
					incrementSong(-1 * songVal);
				}
			}
			else
			{
				audio.pause();
			}
		}

		function monitorClipProgress(token) {
			if (token !== playbackToken || activeRowIndex === -1)
			{
				return;
			}
			if (!audio.paused && !audio.seeking)
			{
				const fg = document.getElementById("ringFg" + (activeRowIndex + 1));
				if (fg && clipTotalSec > 0)
				{
					const frac = Math.max(0, Math.min(1, (audio.currentTime - clipStartSec) / clipTotalSec));
					fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - frac));
				}
				if (clipEndTime !== null && audio.currentTime >= clipEndTime)
				{
					finishCurrentClip(token);
					return;
				}
			}
			clipRafId = requestAnimationFrame(function() {
				monitorClipProgress(token);
			});
		}

		function beginTrackAt(targetIdx, token) {
			if (token !== playbackToken) return;
			showRowPlaying(targetIdx);
			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipOriginSec = 0;
				clipStartSec = 0;
				clipEndTime = null;
				clipTotalSec = dur;
				audio.currentTime = 0;
			}
			else
			{
				const clipSec = timer / 1000;
				const maxStart = Math.max(0, dur - clipSec);
				clipStartSec = Math.min(timestamps[targetIdx] || 0, maxStart);
				clipOriginSec = clipStartSec;
				clipEndTime = Math.min(clipStartSec + clipSec, dur - 0.03);
				clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
				audio.currentTime = clipStartSec;
			}
			const playPromise = audio.play();
			if (playPromise && typeof playPromise.catch === "function")
			{
				playPromise.catch(function(err) {
					if (token === playbackToken && (!err || err.name !== "AbortError"))
					{
						pausePlayback();
					}
				});
			}
			monitorClipProgress(token);
		}

		function loadAudio() {
			if (!quizLinks.length || !quizLinks[songVal]) return;
			pauseQuizEmbed();
			cancelClipMonitor();
			pendingLoadToken = playbackToken;
			showRowPlaying(songVal);
			playing = true;
			toggleButtons();
			audio.src = quizLinks[songVal];
			audio.load();
		}

		function startPlayback(token) {
			if (token !== playbackToken) return;
			toggleButtons();
			preloadNextTrack(songVal + 1);
			beginTrackAt(songVal, token);
		}

		function loadClip(i) {
			if (!quizLinks[i]) return;
			pauseQuizEmbed();
			cancelClipMonitor();
			pendingLoadToken = playbackToken;
			clipIndex = i;
			showRowPlaying(i);
			playing = false;
			toggleButtons();
			audio.src = quizLinks[clipIndex];
			audio.load();
		}

		function playClip(token) {
			if (token !== playbackToken) return;
			beginTrackAt(clipIndex, token);
		}

		function pausePlayback() {
			cancelClipMonitor();
			pendingLoadToken = -1;
			clearRowPlaying();
			audio.pause();
			playing = false;
			toggleButtons();
		}

		function incrementSong(i) {
			const wasPlaying = playing;
			cancelClipMonitor();
			clearRowPlaying();
			if (!wasPlaying)
			{
				pendingLoadToken = -1;
				audio.pause();
			}

			const activeCount = quizSongs.length || totalSongs;
			songVal = Math.max(0, Math.min(activeCount - 1, songVal + i));
			document.getElementById("currentSong").innerText = (songVal + 1) + " of " + activeCount;

			toggleButtons();

			if (wasPlaying)
			{
				loadAudio();				
			}
		}

		function generateSeed() {
			document.getElementById("seedInput").value = Math.floor(Math.random() * (900000) + 100000);
		}

		function startRandomQuiz() {
			generateSeed();
			createSongQuiz();
		}

		async function createSongQuiz() {
			const rawSeed = document.getElementById("seedInput").value.trim();
			if (!/^\d+$/.test(rawSeed))
			{
				showNewQuizDialog("Numeric seeds only!");
				return;
			}

			const selectedInputs = Array.from(document.querySelectorAll('#checkboxes input[type="checkbox"]:checked'));
			if (selectedInputs.length === 0)
			{
				updateNewQuizBtn();
				return;
			}

			const gen = ++quizGeneration;
			pausePlayback();
			pauseQuizEmbed();
			if (!firstQuiz)
			{
				showNewQuizDialog();
			}

			const rawFiles = [];
			for (let i = 0; i < selectedInputs.length; i++)
			{
				const file = await fetch(`jsons/${selectedInputs[i].id}.json`);
				const fileText = await file.text();
				if (gen !== quizGeneration) return;
				rawFiles.push([selectedInputs[i], fileText]);
			}
			if (gen !== quizGeneration) return;

			seed = Number(rawSeed);
			resetHTML();
			let songStats = [];

			const shuffledFiles = shuffle(rawFiles);

			let maxListLength = 0;
			for (let i = 0; i < shuffledFiles.length; i++)
			{
				const fileArr = parseStringToJsonToArrays(shuffledFiles[i][1]);
				maxListLength = fileArr.length > maxListLength ? fileArr.length : maxListLength;
				songStats.push(shuffle(fileArr));
			}

			let songStatsEqualized = [];
			for (let i = 0; i < maxListLength; i++)
			{
				for (const arr of songStats)
				{
					if (i < arr.length)
					{
						songStatsEqualized.push(arr[i]);
					}
				}
			}

			const seenUris = new Set();
			const seenPreviews = new Set();
			const seenNormKeys = new Set();
			let songStatsCleaned = [];
			for (let i = 0; i < songStatsEqualized.length; i++)
			{
				const stat = songStatsEqualized[i];
				const uriKey = stat[2] || "";
				const prevKey = (stat[1] || "").split("?")[0];
				const normKey = normalizeSongKey(stat[3] || stat[0], stat[4] || "");
				if ((uriKey && seenUris.has(uriKey)) || (prevKey && seenPreviews.has(prevKey)) || (normKey && seenNormKeys.has(normKey)))
				{
					continue;
				}
				if (uriKey) seenUris.add(uriKey);
				if (prevKey) seenPreviews.add(prevKey);
				if (normKey) seenNormKeys.add(normKey);
				songStatsCleaned.push(stat);
			}

			let quizStats = [];
			for (let i = 0; i < songStatsCleaned.length; i++)
			{
				if (i < totalSongs)
				{
					quizStats.push(songStatsCleaned[i]);
															// length of Spotify previews
					timestamps.push(Math.floor(seededRandom((30 - (timer / 1000)))));

					let songBox = document.getElementById("guess" + (i + 1));
					let songTitleBox = document.createElement("div");
					songTitleBox.classList.add('answer-box');
					let blankContainer = document.createElement("div");
					let blank = document.createElement("span");
					blank.className = "song-label-title";
					blank.id = "guessText" + (i + 1);

					const speakerIcon = document.createElement("button");
					speakerIcon.type = "button";
					speakerIcon.id = "speaker" + (i + 1);
					speakerIcon.className = "row-speaker-btn";
					speakerIcon.setAttribute("aria-label", "Play clip " + (i + 1));
					speakerIcon.innerHTML = MELODLE_ICONS.speaker;

					const pauseWrap = document.createElement("button");
					pauseWrap.type = "button";
					pauseWrap.id = "pauseWrap" + (i + 1);
					pauseWrap.classList.add("row-pause-wrap");
					pauseWrap.setAttribute("aria-label", "Pause clip " + (i + 1));
					pauseWrap.innerHTML = '<svg class="clip-ring-svg" viewBox="0 0 22 22"><circle class="clip-ring-bg" cx="11" cy="11" r="9"></circle><circle class="clip-ring-fg" id="ringFg' + (i + 1) + '" cx="11" cy="11" r="9"></circle></svg><span class="row-pause-icon">' + MELODLE_ICONS.pause + '</span>';

					speakerIcon.onclick = function () {
						const hadFocus = (document.activeElement === speakerIcon);
						loadClip(i);
						if (hadFocus && pauseWrap.style.display !== "none") pauseWrap.focus();
					};
					pauseWrap.onclick = function () {
						const hadFocus = (document.activeElement === pauseWrap);
						pausePlayback();
						if (hadFocus) speakerIcon.focus();
					};

					blankContainer.appendChild(blank);
					songTitleBox.appendChild(blankContainer);
					songTitleBox.appendChild(speakerIcon);
					songTitleBox.appendChild(pauseWrap);

					songBox.appendChild(songTitleBox);
				}
				songs.push(songStatsCleaned[i][0]);
				if (songStatsCleaned[i][4])
				{
					artistBySong.set(songStatsCleaned[i][0], String(songStatsCleaned[i][4]));
				}
			}

			quizStats = shuffle(quizStats);
			for (const songStat of quizStats)
			{
				// console.log(songStat[0]); // for debugging
				quizSongs.push(songStat[0]);
				quizLinks.push(songStat[1]);
				songLinks.push(songStat[2]);
				quizTitles.push(songStat[3]);
			}

			// now with alphabetical powers
			document.getElementById("currentSong").innerText = quizSongs.length ? ("1 of " + quizSongs.length) : "0 of 0";
			toggleButtons();
			songs.sort(sortBySongName);
			autocomplete(document.getElementById("myInput"), songs);
			preloadNextTrack(0);
		}

		function sortBySongName(a, b) {
			return a.localeCompare(b, undefined, { sensitivity: 'base' });
		}

		function toggleButtons() {
			play = document.getElementById("play-button");
			pause = document.getElementById("pause-button");

			prev = document.getElementById("prev-button");
			next = document.getElementById("next-button");

			prevD = document.getElementById("prev-disabled-button");
			nextD = document.getElementById("next-disabled-button");
			play.style.display = playing ? 'none' : '';
			pause.style.display = playing ? '' : 'none';

			const activeCount = quizSongs.length || totalSongs;
			prev.style.display = (songVal == 0) ? 'none' : '';
			prevD.style.display = (songVal == 0) ? '' : 'none';
			next.style.display = (songVal >= activeCount - 1) ? 'none' : '';
			nextD.style.display = (songVal >= activeCount - 1) ? '' : 'none';
		}

		function giveUp() {
			if (!quizSongs.length) return;
			cancelClipMonitor();
			clearRowPlaying();
			playing = false;
			audio.pause();

			const activeCount = quizSongs.length;
			let songsFound = activeCount;

			for (let i = 0; i < activeCount; i++)
			{
				let songTitleText = document.getElementById("guessText" + (i + 1));
				if (!songTitleText) continue;

				if (songTitleText.innerText == "")
				{
					songsFound--;
					songTitleText.innerText = quizTitles[i];
					songTitleText.classList.add("missed-song-text");
					const slot = document.getElementById("slot" + (i + 1));
					if (slot) slot.classList.add("is-missed");
				}
				songTitleText.title = quizTitles[i];

				songTitleText.onclick = function () {
					songVal = i;
					document.getElementById("hiddenPlayBtn").click();
				};

				songTitleText.style.cursor = "pointer";
			}

			const go1 = document.getElementById("game-over-section-1");
			go1.innerHTML = (songsFound === activeCount) ? "<b>YOU WIN</b>" : "<b>GAME OVER</b>";
			go1.style.display = 'block';
			document.getElementById("game-over-section-2").style.display = 'block';
			document.getElementById("game-over-section-2").innerText = (songsFound === activeCount) ? "All songs found!" : ("" + songsFound + " of " + activeCount + " songs found.");
			document.getElementById("main-section-1").style.display = 'none';
			document.getElementById("main-section-2").style.display = 'none';
			document.getElementById("main-section-3").style.display = 'none';
			document.getElementById("giveUpBtn").disabled = true;
			document.getElementById("giveUpBtn").style.display = 'none';
			document.getElementById("quiz-game-over-row").appendChild(document.getElementById("difficulty-container"));
			document.getElementById("quiz-game-over-row").style.display = 'grid';

			document.getElementById("player-iframe").style.width = "100%";
			document.getElementById("player-iframe").style.height = "auto";
			document.getElementById("player-iframe").style.overflow = "visible";
			document.getElementById("player-iframe").style.padding = "20px 0 0";

			songVal = 0;
			document.getElementById("hiddenPlayBtn").click();
		}

		function checkAnswer() {
			input = document.getElementById('myInput').value;

			if (songs.includes(input))
			{
				document.getElementById('myInput').value = '';
				if (guessedSongs.has(input))
				{
					return;
				}
				guessedSongs.add(input);

				if (quizSongs.includes(input))
				{
					const matchIdx = quizSongs.indexOf(input);
					const guessEl = document.getElementById("guessText" + (matchIdx + 1));
					guessEl.innerText = quizTitles[matchIdx];
					guessEl.title = quizTitles[matchIdx];
					const slot = document.getElementById("slot" + (matchIdx + 1));
					if (slot) slot.classList.add("is-solved");

					let allFound = quizSongs.length > 0;
					for (let i = 0; i < quizSongs.length; i++)
					{
						const box = document.getElementById("guessText" + (i + 1));
						if (!box || box.innerText == "")
						{
							allFound = false;
							break;
						}
					}
					if (allFound)
					{
						giveUp();
					}
				}
				else
				{
					wrongAnswers++;
					document.getElementById("wrong-answer-" + wrongAnswers).innerHTML = MELODLE_ICONS.x;

					if (wrongAnswers == 5)
					{
						giveUp();
					}
				}
			}
		}

		function parseStringToJsonToArrays(str) {
			const fileJSON = JSON.parse(str.toString());

			tmpArr = [];

			for (let i of fileJSON)
			{
				if (i.trackLink)
				{
					let trackUri = i.trackLink.replace("\\/", "/");
					if (trackUri.includes("open.spotify.com/track/")) {
						let trackId = trackUri.split("track/")[1].split("?")[0];
						trackUri = "spotify:track:" + trackId;
					}
					tmpArr.push([i.title + " - " + i.artist, i.preview.replace("\\/", "/"), trackUri, i.title, i.artist]);
				}
			}

			return tmpArr;
		}

		function normalizeSongKey(title, artist) {
			const strip = function(s) {
				return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
			};
			const cleanTitle = String(title).replace(/\s*-\s*\d{4}\s*remaster.*|\s*\((?:from|feat\.?|with)\b.*?\)/gi, "");
			const primaryArtist = String(artist).split(/,|\b(?:feat\.?|featuring|with)\b/i)[0];
			return strip(cleanTitle) + "||" + strip(primaryArtist);
		}

		// stolen from https://stackoverflow.com/questions/16801687/javascript-random-ordering-with-seed
		function seededRandom(max) {
			seed = (seed + 0x6D2B79F5) | 0;
			let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return Math.floor((max + 1) * (((t ^ (t >>> 14)) >>> 0) / 4294967296));
		}

		function shuffle(array) {
			var index = array.length - 1;

			while (index > 0)
			{
				let tmpIndex = seededRandom(index);

				let tmp = array[index];
				array[index] = array[tmpIndex];
				array[tmpIndex] = tmp;

				index--;
			}

			return array;
		}

		function resetHTML() {
			cancelClipMonitor();
			pendingLoadToken = -1;
			clearRowPlaying();
			audio.pause();
			pauseQuizEmbed();
			
			quizLinks = [];
			songLinks = [];
			quizSongs = [];
			quizTitles = [];
			timestamps = [];
			songs = [];
			
			songVal = 0;
			playing = false;
			wrongAnswers = 0;
			guessedSongs.clear();
			artistBySong.clear();

			document.getElementById("myInput").value = "";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });
			document.getElementById("currentSong").innerText = (songVal + 1) + " of " + totalSongs;
			toggleButtons();

			for (let i = 1; i <= 5; i++)
			{
				document.getElementById("wrong-answer-" + i).innerHTML = "";
			}

			for (let i = 0; i < totalSongs; i++)
			{
				songBox = document.getElementById("guess" + (i + 1));
				songBox.innerHTML = "";
				const slot = document.getElementById("slot" + (i + 1));
				if (slot) slot.className = "track-slot";
			}

			document.getElementById("quiz-game-over-row").style.display = 'none';
			document.getElementById("game-over-section-1").style.display = 'none';
			document.getElementById("game-over-section-2").style.display = 'none';
			document.getElementById("main-section-2").appendChild(document.getElementById("difficulty-container"));
			document.getElementById("main-section-1").style.display = '';
			document.getElementById("main-section-2").style.display = '';
			document.getElementById("main-section-3").style.display = '';

			document.getElementById("giveUpBtn").style.display = '';
			document.getElementById("giveUpBtn").disabled = false;

			document.getElementById("player-iframe").style.width = "0";
			document.getElementById("player-iframe").style.height = "0";
			document.getElementById("player-iframe").style.overflow = "hidden";
			document.getElementById("player-iframe").style.padding = "0";
		}

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				searchResults = 0;
				for (i = 0; i < arr.length; i++) {
					if (!guessedSongs.has(arr[i]) && arr[i].toUpperCase().includes(val.toUpperCase())) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = buildAutocompleteItem(itemValue, val, artistBySong.get(itemValue));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						searchResults++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}
	</script>
