<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Melodle Timeline</title>
	<link rel="icon" type="image/x-icon" href="img/logo.png">
	<style>
		@font-face {
			font-family: 'Lato';
			src: url('resources/Lato-Regular.ttf');
		}
		@font-face {
			font-family: 'Lato-Bold';
			src: url('resources/Lato-Bold.ttf');
		}
		@font-face {
			font-family: 'Lato-Black';
			src: url('resources/Lato-Black.ttf');
		}
		body {
			font-family: Helvetica;
			background-color: #f6f6f6;
			overscroll-behavior: none;
			margin: 0;
			min-height: 100vh;
			display: flex;
			padding: 5vh 16px;
			box-sizing: border-box;
		}
		.page-container {
			display: grid;
			grid-template-columns: 1fr;
			gap: 40px;
			width: 90%;
			min-width: 1000px;
			position: relative;
			margin: auto;
			justify-items: center;
			align-items: center;
		}
		.title-row {
			width: 750px;
			padding: 5px;
			justify-content: space-between;
			align-items: center;
			font-size: 60px;
			margin: auto;
			text-align: center;
			border-bottom: solid;
		}
		.now-playing-container {
			display: flex;
			gap: 40px;
			width: 650px;
		}
		.album-container {
			overflow: hidden;
			border: 8px double #171717;
			border-radius: 8px;
			width: 300px;
			height: 300px;
			min-width: 300px;
			min-height: 300px;
		}
		#np-album {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}
		.song-data-container {
			display: flex;
			flex-direction: column;
			gap: 5px;
			text-align: center;
			width: 100%;
			align-items: center;
			margin: auto;
		}
		.song-data {
			width: 100%;
			display: grid;
			grid-template-columns: 4fr 1fr;
			gap: 10px;
			justify-items: center;
			align-items: center;
		}
		.song-specs {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.data-row {
			font-family: "Lato";
		}
		#qm {
			font-family: "Lato-Bold";
			font-size: 84px;
			padding-bottom: 10px;
		}
		#song-title {
			font-size: 20px;
		}
		#song-artist {
			font-size: 18px;
		}
		#song-year {
			font-family: "Lato-Black";
			font-size: 24px;
			padding: 10px 0;
		}
		#win {
			font-family: "Lato-Bold";
			font-size: 40px;
			padding-top: 10px;
		}
		#lose {
			font-family: "Lato-Bold";
			font-size: 40px;
			padding-top: 10px;
		}
		.next-arrow {
			align-content: center;
		}
		.song-data img {
			width: 30px;
			cursor: pointer;
		}
		.wrong-answer {
			border: 2px solid black;
			border-radius: 5px;
			width: 45px;
			height: 45px;
			align-content: center;
		}
		.wrong-answer img {
			width: 35px;
			height: 35px;
		}
		#wrong-answer-boxes {
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 8px;
			justify-items: center;
			padding-top: 10px;
		}
		.timeline-container {
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			text-align: center;
			font-family: "Lato-Bold";
			font-size: 22px;
			gap: 5px;
		}
		.timeline-label {
			width: 100%;
			padding-left: 8px; /* 5px padding + 3px border of timeline */
			box-sizing: border-box;
		}
		.timeline {
			display: flex;
			width: 100%;
			height: 100%;
			align-items: center;
			justify-content: center;
			border: 3px solid;
			border-radius: 5px;
			padding: 5px;
			box-sizing: border-box;
		}
		.timeline .pick-me {
			width: 50px;
			cursor: pointer;
		}
		.timeline .a-container {
			display: flex;
			flex-direction: column;
			gap: 10px;
			width: 9%;
			text-align: center;
			font-size: 20px;
			font-weight: bold;
			font-family: "Lato-Black";
			line-height: 1;
		}
		.timeline .a-container .album-art {
			width: 100%;
			aspect-ratio: 1 / 1;
			object-fit: cover;
			display: block;
		}
		.node {
			display: flex;
			align-items: center;
			justify-content: center;
			align-self: stretch;
			text-align: center;
			width: 1%;
			cursor: default;
		}
		.timeline.is-guessing .node {
			cursor: pointer;
		}
		.node-img {
			max-width: 70%;
			max-height: 140px;
			object-fit: scale-down;
			cursor: pointer;
		}
		@media (hover: none) {
			.timeline.is-guessing .node {
				width: 4%;
			}
			.timeline.is-guessing .node .node-img {
				width: auto !important;
			}
		}
		audio::-webkit-media-controls-enclosure {
			border-radius: 0;
			background-color: #f6f6f6;
		}
		.mode-nav {
			position: fixed;
			top: 20px;
			left: 16px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			z-index: 100;
			font-family: Helvetica, Arial, sans-serif;
		}
		.mode-nav a {
			display: block;
			padding: 7px 14px;
			border-radius: 8px;
			font-size: 13px;
			font-weight: bold;
			text-decoration: none;
			text-align: center;
			color: #191414;
			background-color: #ffffff;
			border: 1px solid #cccccc;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
			cursor: pointer;
		}
		.mode-nav a:hover {
			background-color: #e8e8e8;
		}
		.mode-nav a.active {
			background-color: #191414;
			color: #ffffff;
			border-color: #191414;
		}
		@media (max-width: 1260px) {
			body {
				flex-direction: column;
				align-items: center;
				gap: 16px;
			}
			.mode-nav {
				position: static;
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
			}
		}
		@media (max-width: 1032px) {
			.page-container {
				min-width: 750px;
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<nav class="mode-nav">
		<a href="index.html">Daily Melodle</a>
		<a href="quiz.html">Song Quiz</a>
		<a href="billboard.html">Billboard</a>
		<a href="timeline.html" class="active">Timeline</a>
	</nav>
	<div class="page-container">
		<div class="title-row">
			<div id="title">
				<b>Melodle Timeline</b>
			</div>
		</div>
		<div class="now-playing-container" id="np-container">
			<div class="album-container" id="album-container">
				<img id="np-album">
			</div>
			<div class="song-data-container" id="song-data-container">
				<div class="data-row" id="qm">
					?
				</div>
				<div class="song-data" id="song-data" style="display: none;">
					<div class="song-specs" id="song-specs">
						<div class="data-row" id="song-title">
						</div>
						<div class="data-row" id="song-artist">
						</div>
						<div class="data-row" id="song-year">
						</div>
					</div>
					<img src="img/double_next.png" id="next" onclick="goToNextSong()">
					<img src="img/restart.png" id="restart" style="display: none;" onclick="startQuiz()">
				</div>
				<audio controls id="audio"></audio>
				<div class="data-row" id="wrong-answer-boxes">
					<div class="wrong-answer" id="wrong-answer-1"></div>
					<div class="wrong-answer" id="wrong-answer-2"></div>
					<div class="wrong-answer" id="wrong-answer-3"></div>
					<div class="wrong-answer" id="wrong-answer-4"></div>
					<div class="wrong-answer" id="wrong-answer-5"></div>
				</div>
				<div class="data-row" id="win" style="display: none;">
					YOU WIN!
				</div>
				<div class="data-row" id="lose" style="display: none;">
					GAME OVER
				</div>
			</div>
		</div>
		<div class="timeline-container">
			<div class="timeline-label">
				TIMELINE
			</div>
			<div class="timeline" id="tl-container">
			</div>
		</div>
	</div>

	<script>
		let song_data = [];
		let index = 0;
		let insert_index = 0;
		let wrongAnswers = 0;
		let active_song = {};
		let albums = [];
		let years = [];
		let guessing = true;

		const np_album = document.getElementById("np-album");

		document.addEventListener("DOMContentLoaded", async function() {
			try {
				const response = await fetch('./jsons/data/top_10s_data.json');
				song_data = await response.json();
				song_data = song_data.filter(function(song) {
					return Boolean(song && song.link && song.picture);
				});
			}
			catch(error) {
				console.error('Error:', error);
			}

			if (!song_data.length) return;

			shuffle(song_data);

			startQuiz();
		});

		function startQuiz() {
			if (!song_data.length) return;
			albums = [];
			years = [];
			insert_index = 0;

			restart.style.display = 'none';
			win.style.display = 'none';
			lose.style.display = 'none';
			next.style.display = '';

			document.getElementById("wrong-answer-boxes").style.display = '';
			wrongAnswers = 0;
			const elements = document.querySelectorAll(".wrong-answer");
			elements.forEach(element => {
				element.innerHTML = "";
			});

			audio.volume = 0.25;
			goToNextSong();
			redrawTimeline();
			goToNextSong();
		}

		function goToNextSong() {
			if (!song_data.length) return;
			let checked = 0;
			while (checked < song_data.length) {
				if (index >= song_data.length) {
					shuffle(song_data);
					index = 0;
				}
				const candidate = song_data[index++];
				checked++;
				if (!years.includes(candidate.year)) {
					active_song = candidate;
					break;
				}
			}
			np_album.src = active_song.picture;
			np_album.style.filter = "blur(2rem)";
			guessing = true;
			document.getElementById("tl-container").classList.add("is-guessing");


			document.getElementById("qm").style.display = '';
			document.getElementById("song-data").style.display = 'none';

			audio.src = active_song.link;
		}

		function redrawTimeline() {
			document.getElementById("qm").style.display = 'none';

			document.getElementById("song-data").style.display = '';
			document.getElementById("song-title").innerText = active_song.title;
			document.getElementById("song-artist").innerText = active_song.artist;
			document.getElementById("song-year").innerText = active_song.year;

			let correctGuess = false;
			if (years.length == 0)
			{
				correctGuess = true;
			}
			else if (insert_index == 0)
			{
				correctGuess = (active_song.year <= years[0]);
			}
			else if (insert_index == years.length)
			{
				correctGuess = (active_song.year >= years[years.length - 1]);
			}
			else
			{
				correctGuess = (active_song.year >= years[insert_index - 1]) && (active_song.year <= years[insert_index]);
			}
			if (correctGuess)
			{
				albums.splice(insert_index, 0, active_song.picture);
				years.splice(insert_index, 0, active_song.year);				
			}
			else
			{
				wrongAnswers++;
				let xImg = document.createElement("img");
				xImg.src = "img/x.png";
				document.getElementById("wrong-answer-" + wrongAnswers).appendChild(xImg);
			}

			if (wrongAnswers == 5 || years.length == 10)
			{
				next.style.display = 'none';
				document.getElementById("wrong-answer-boxes").style.display = 'none';

				restart.style.display = '';
				win.style.display = (years.length == 10) ? '' : 'none';
				lose.style.display = (wrongAnswers == 5) ? '' : 'none';
			}

			np_album.style.filter = "";
			guessing = false;

			let timeline = document.getElementById("tl-container");
			timeline.classList.remove("is-guessing");
			timeline.innerHTML = "";

			let spacer = document.createElement("div");
			spacer.classList.add("node");
			document.getElementById("tl-container").appendChild(spacer);

			for (let i = 0; i < albums.length; i++)
			{
				let album = albums[i];
				let year = years[i];

				let aContainer = document.createElement("div");
				aContainer.classList.add("a-container");
				let aElem = document.createElement("img");
				aElem.src = album;
				aElem.classList.add("album-art");
				let aDate = document.createElement("text");
				aDate.innerText = year;
				aContainer.appendChild(aElem);
				aContainer.appendChild(aDate);
				document.getElementById("tl-container").appendChild(aContainer);

				spacer = document.createElement("div");
				spacer.classList.add("node");
				document.getElementById("tl-container").appendChild(spacer);
			}

			const elements = document.querySelectorAll(".node");
			let nodeVal = -1;

			elements.forEach(element => {
				const slotIdx = ++nodeVal;
				let nodeImg = document.createElement("img");
				nodeImg.classList.add("node-img");
				nodeImg.src = "img/insert.png";
				nodeImg.value = slotIdx;
				element.onclick = function() {
					if (!guessing) return;
					insert_index = slotIdx;
					redrawTimeline();
				};
				element.appendChild(nodeImg);
				element.querySelectorAll("img")[0].style.width = "0%";

				element.onmouseenter = function() {
					if (guessing)
					{
						element.style.width = "5%";
						element.querySelectorAll("img")[0].style.width = "";
					}
				};

				element.onmouseleave = function() {
					if (guessing)
					{
						element.style.width = "";
						element.querySelectorAll("img")[0].style.width = "0%";
					}
				};
			});
		}

		function shuffle(array) {
			for (var i = array.length - 1; i >= 0; i--) {
				var j = Math.floor(Math.random() * (i + 1));
				var temp = array[i];
				array[i] = array[j];
				array[j] = temp;
			}
		}
	</script>
</body>

</html>
