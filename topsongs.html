<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Melodle Top Songs — Name the 50 biggest Billboard Hot 100 songs of any year since 1958.">
	<title>Melodle Top Songs</title>
	<link rel="icon" type="image/png" href="img/logo.png">
	<script>(function(){try{var t=localStorage.getItem('melodle-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<nav class="mode-nav" aria-label="Game modes">
		<a href="index.html">Daily Melodle</a>
		<a href="quiz.html">Song Quiz</a>
		<a href="billboard.html">Billboard</a>
		<a href="topsongs.html" class="active">Top Songs</a>
		<a href="timeline.html">Timeline</a>
		<div class="nav-divider"></div>
		<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle color theme">Dark Mode</button>
	</nav>
	<div class="container topsongs-container">
		<header class="masthead" id="title-row">
			<img src="img/logo.png" class="masthead-logo" alt="Melodle logo">
			<h1 id="title">Melodle Top Songs</h1>
		</header>

		<section id="year-picker">
			<div class="ts-eyebrow">Pick a year</div>
			<div class="ts-year-grid" id="year-grid"></div>
		</section>

		<section id="game-section" class="hidden-item">
			<div class="ts-game-header">
				<button type="button" class="btn-secondary ts-back-btn" id="backBtn" onclick="showYearPicker()">&larr; All Years</button>
				<div class="ts-year-title" id="year-title"></div>
				<div class="ts-header-right">
					<div class="modals-subcontainer" id="difficulty-container">
						<label class="switch">
							<input type="checkbox" id="difficulty">
							<span class="slider round"></span>
						</label>
						<div>Easy Mode</div>
					</div>
					<div class="slider-container" id="volume-container">
						<button type="button" class="volume-btn" onclick="incrementVolume(-10)" aria-label="Decrease volume" title="Decrease volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg></button>
						<input type="range" min="0" max="100" value="80" class="volume-slider" id="volume-slider" step="1" aria-label="Volume">
						<button type="button" class="volume-btn" onclick="incrementVolume(10)" aria-label="Increase volume" title="Increase volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
					</div>
				</div>
			</div>

			<div class="ts-search-row" id="search-row">
				<div class="auto-container" autocomplete="off">
					<div class="autocomplete autocomplete-down">
						<input id="myInput" type="text" name="myInput" placeholder="Loading songs ..." disabled>
						<button type="button" class="submit" onclick="checkAnswer()" aria-label="Submit guess"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
					</div>
				</div>
				<div class="ts-miss-count" id="miss-count">Misses <b>0</b></div>
				<button type="button" class="btn-danger-outline giveUpBtn" id="giveUpBtn" onclick="giveUp()">Give Up</button>
			</div>

			<div class="ts-gameover-row" id="game-over-row">
				<div class="gameover-stack">
					<div id="game-over-section-1"><b>GAME OVER</b></div>
					<div id="game-over-section-2"></div>
				</div>
				<button type="button" class="ts-next-btn" id="nextYearBtn" onclick="nextYear()">Next Year &rarr;</button>
			</div>

			<div class="ts-columns-grid" id="slot-grid"></div>
		</section>

		<audio controls class="hidden-item" id="audio"></audio>
	</div>

	<script src="theme.js"></script>
	<script type="text/javascript">
		var timer = 4000;
		var totalSongs = 50;

		let timeRunning = null;
		let playbackToken = 0;
		let pendingLoadToken = -1;
		let clipOriginSec = 0;
		let clipStartSec = 0;
		let clipTotalSec = 4;
		let clipEndTime = null;
		let clipRafId = null;
		let clipPlaying = false;
		const RING_CIRCUMFERENCE = 2 * Math.PI * 9;
		const MAX_AUTOCOMPLETE_RESULTS = 60;

		const audio = document.getElementById("audio");
		const difficulty = document.getElementById("difficulty");

		let topSongsByYear = {};
		let availableYears = [];
		let songs = [];
		let songsUpper = [];
		let songSet = new Set();
		let artistBySong = new Map();
		let guessedSongs = new Set();
		let quizSongs = [];
		let nameToSlot = new Map();
		let solved = [];
		let timestamps = [];
		let misses = 0;
		let currentYear = null;
		let gameOver = false;
		let songVal = -1;

		document.addEventListener("DOMContentLoaded", async function() {
			buildSlots();
			setVolume();

			try {
				const response = await fetch('./jsons/data/top_songs.json');
				const data = await response.json();
				topSongsByYear = data.years || {};
			}
			catch(error) {
				console.error('Error:', error);
			}
			availableYears = Object.keys(topSongsByYear).map(Number).sort(function(a, b) { return a - b; });
			buildYearGrid();

			try {
				const response = await fetch('./jsons/data/hot100_songs.json');
				const pool = await response.json();
				for (const pair of pool)
				{
					const fullName = pair[0] + ' - ' + pair[1];
					if (songSet.has(fullName)) continue;
					songSet.add(fullName);
					songs.push(fullName);
					artistBySong.set(fullName, pair[1]);
				}
				songs.sort(function(a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base' }); });
				songsUpper = songs.map(function(s) { return s.toUpperCase(); });
			}
			catch(error) {
				console.error('Error:', error);
			}

			const input = document.getElementById("myInput");
			input.disabled = false;
			input.placeholder = "Type a song name ...";
			autocomplete(input, songs);
		});

		function buildSlots() {
			const grid = document.getElementById("slot-grid");
			for (let c = 0; c < 5; c++)
			{
				const col = document.createElement("div");
				col.className = "quiz-col";
				for (let r = 0; r < 10; r++)
				{
					const n = c * 10 + r + 1;
					const slot = document.createElement("div");
					slot.className = "track-slot";
					slot.id = "slot" + n;
					const num = document.createElement("span");
					num.className = "num-box";
					num.id = "num" + n;
					num.textContent = n + ".";
					const guess = document.createElement("div");
					guess.className = "guess-box";
					guess.id = "guess" + n;
					slot.appendChild(num);
					slot.appendChild(guess);
					col.appendChild(slot);
				}
				grid.appendChild(col);
			}
		}

		function buildYearGrid() {
			const grid = document.getElementById("year-grid");
			grid.innerHTML = "";
			if (!availableYears.length) return;
			const available = new Set(availableYears);
			const firstYear = availableYears[0];
			const lastYear = new Date().getFullYear();
			for (let decade = Math.floor(firstYear / 10) * 10; decade <= lastYear; decade += 10)
			{
				const row = document.createElement("div");
				row.className = "ts-decade-row";
				const label = document.createElement("div");
				label.className = "ts-decade-label";
				label.textContent = decade + "s";
				row.appendChild(label);
				for (let y = decade; y < decade + 10; y++)
				{
					const btn = document.createElement("button");
					btn.type = "button";
					btn.className = "ts-year-btn";
					btn.textContent = String(y);
					if (y < firstYear || y > lastYear)
					{
						btn.classList.add("is-empty");
						btn.disabled = true;
						btn.tabIndex = -1;
					}
					else if (!available.has(y))
					{
						btn.disabled = true;
						btn.title = (y === lastYear) ? "Available once the year is over" : "Not available yet";
					}
					else
					{
						btn.onclick = function() { startYear(y); };
					}
					row.appendChild(btn);
				}
				grid.appendChild(row);
			}
		}

		function showYearPicker() {
			pausePlayback();
			if (songVal != -1) flipIcons(false);
			songVal = -1;
			document.getElementById("game-section").classList.add("hidden-item");
			document.getElementById("year-picker").classList.remove("hidden-item");
		}

		function resetGame() {
			pausePlayback();
			if (songVal != -1) flipIcons(false);
			songVal = -1;
			misses = 0;
			gameOver = false;
			guessedSongs.clear();
			nameToSlot.clear();
			solved = new Array(totalSongs).fill(false);
			timestamps = [];
			updateMisses();

			const input = document.getElementById("myInput");
			input.value = "";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });

			for (let i = 0; i < totalSongs; i++)
			{
				document.getElementById("slot" + (i + 1)).className = "track-slot";
				document.getElementById("guess" + (i + 1)).innerHTML = "";
			}

			document.getElementById("game-over-row").style.display = "none";
			document.getElementById("game-over-section-1").style.display = "none";
			document.getElementById("game-over-section-2").style.display = "none";
			document.getElementById("search-row").style.display = "";
			document.getElementById("giveUpBtn").disabled = false;
		}

		function startYear(year) {
			const rows = topSongsByYear[String(year)];
			if (!rows || rows.length < totalSongs) return;
			resetGame();
			currentYear = year;
			quizSongs = rows.slice(0, totalSongs);
			document.getElementById("year-title").textContent = String(year);

			const rng = createSeededRng(year * 7919 + 50);
			for (let i = 0; i < totalSongs; i++)
			{
				// length of Spotify previews
				timestamps.push(Math.floor(rng() * (30 - (timer / 1000))));
				for (const nm of quizSongs[i].names)
				{
					nameToSlot.set(nm, i);
				}
				buildSlotContent(i);
			}

			document.getElementById("year-picker").classList.add("hidden-item");
			document.getElementById("game-section").classList.remove("hidden-item");
			window.scrollTo(0, 0);
			const input = document.getElementById("myInput");
			if (!input.disabled) input.focus();
		}

		function buildSlotContent(i) {
			const songBox = document.getElementById("guess" + (i + 1));
			const songTitleBox = document.createElement("div");
			songTitleBox.classList.add("answer-box");
			songTitleBox.id = "answerBox" + (i + 1);
			const blankContainer = document.createElement("div");
			const blank = document.createElement("span");
			blank.id = "guessText" + (i + 1);

			const speakerIcon = document.createElement("button");
			speakerIcon.type = "button";
			speakerIcon.className = "row-speaker-btn";
			speakerIcon.id = "speaker" + (i + 1);
			speakerIcon.setAttribute("aria-label", "Play preview for rank " + (i + 1));
			speakerIcon.innerHTML = MELODLE_ICONS.speaker;

			const pauseWrap = document.createElement("button");
			pauseWrap.type = "button";
			pauseWrap.id = "pauseWrap" + (i + 1);
			pauseWrap.classList.add("row-pause-wrap");
			pauseWrap.setAttribute("aria-label", "Pause preview for rank " + (i + 1));
			pauseWrap.innerHTML = '<svg class="clip-ring-svg" viewBox="0 0 22 22"><circle class="clip-ring-bg" cx="11" cy="11" r="9"></circle><circle class="clip-ring-fg" id="ringFg' + (i + 1) + '" cx="11" cy="11" r="9"></circle></svg><span class="row-pause-icon">' + MELODLE_ICONS.pause + '</span>';

			speakerIcon.onclick = function () {
				const hadFocus = (document.activeElement === speakerIcon);
				loadClip(quizSongs[i].link, i);
				if (hadFocus && pauseWrap.style.display !== "none") pauseWrap.focus();
			};
			pauseWrap.onclick = function () {
				const hadFocus = (document.activeElement === pauseWrap);
				flipIcons(false);
				pausePlayback();
				if (hadFocus) speakerIcon.focus();
			};

			blankContainer.appendChild(blank);
			songTitleBox.appendChild(blankContainer);
			songTitleBox.appendChild(speakerIcon);
			songTitleBox.appendChild(pauseWrap);
			songBox.appendChild(songTitleBox);
		}

		function renderSlotText(i, revealArtist) {
			const el = document.getElementById("guessText" + (i + 1));
			if (!el) return;
			const song = quizSongs[i];
			el.innerHTML = "";
			el.title = song.title + " — " + song.artist;
			const titleSpan = document.createElement("span");
			titleSpan.className = "ts-slot-label";
			titleSpan.textContent = song.title;
			el.appendChild(titleSpan);
			if (revealArtist)
			{
				const artistSpan = document.createElement("span");
				artistSpan.className = "ts-slot-artist";
				artistSpan.textContent = song.artist;
				el.appendChild(artistSpan);
			}
		}

		function updateMisses() {
			document.getElementById("miss-count").innerHTML = "Misses <b>" + misses + "</b>";
		}

		function checkAnswer() {
			if (gameOver) return;
			const inputEl = document.getElementById("myInput");
			const input = inputEl.value;
			if (!songSet.has(input)) return;
			inputEl.value = "";
			if (guessedSongs.has(input)) return;
			guessedSongs.add(input);

			const idx = nameToSlot.get(input);
			if (idx !== undefined && !solved[idx])
			{
				solved[idx] = true;
				for (const nm of quizSongs[idx].names)
				{
					guessedSongs.add(nm);
				}
				renderSlotText(idx, false);
				document.getElementById("slot" + (idx + 1)).classList.add("is-solved");
				if (solved.every(Boolean))
				{
					endGame(true);
				}
			}
			else
			{
				misses++;
				updateMisses();
			}
		}

		function giveUp() {
			if (gameOver || currentYear === null) return;
			pausePlayback();
			if (songVal != -1) flipIcons(false);
			endGame(false);
		}

		function endGame(isWin) {
			gameOver = true;
			let found = 0;
			for (let i = 0; i < totalSongs; i++)
			{
				renderSlotText(i, true);
				if (solved[i])
				{
					found++;
				}
				else
				{
					document.getElementById("guessText" + (i + 1)).classList.add("missed-song-text");
					document.getElementById("slot" + (i + 1)).classList.add("is-missed");
				}
			}

			const go1 = document.getElementById("game-over-section-1");
			go1.innerHTML = isWin ? "<b>YOU WIN</b>" : "<b>GAME OVER</b>";
			go1.style.display = "block";
			const go2 = document.getElementById("game-over-section-2");
			go2.textContent = found + " of " + totalSongs + " found · " + misses + (misses === 1 ? " miss" : " misses");
			go2.style.display = "block";

			const nextBtn = document.getElementById("nextYearBtn");
			const next = getNextYear();
			nextBtn.style.visibility = (next === null) ? "hidden" : "visible";

			document.getElementById("search-row").style.display = "none";
			document.getElementById("giveUpBtn").disabled = true;
			document.getElementById("game-over-row").style.display = "grid";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });
		}

		function getNextYear() {
			for (const y of availableYears)
			{
				if (y > currentYear) return y;
			}
			return null;
		}

		function nextYear() {
			const next = getNextYear();
			if (next !== null) startYear(next);
		}

		audio.addEventListener("loadedmetadata", function() {
			const token = pendingLoadToken;
			pendingLoadToken = -1;
			if (token !== playbackToken) return;
			playClip(token);
		});

		audio.addEventListener("timeupdate", function() {
			if (clipEndTime !== null && !audio.paused && !audio.seeking && audio.currentTime >= clipEndTime)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("ended", function() {
			clipPlaying = false;
			cancelClipMonitor();
			if (songVal != -1) flipIcons(false);
		});

		audio.addEventListener("error", function() {
			if (audio.getAttribute("src"))
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("pause", function() {
			if (pendingLoadToken === -1 && clipPlaying && !audio.ended && !audio.seeking)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		document.getElementById("volume-slider").addEventListener("input", function() {
			setVolume();
		});

		function setVolume() {
			audio.volume = document.getElementById("volume-slider").value / 100;
		}

		function incrementVolume(i) {
			const slider = document.getElementById("volume-slider");
			let vol = parseInt(slider.value, 10) + i;
			if (vol > Number(slider.max)) vol = Number(slider.max);
			if (vol < Number(slider.min)) vol = Number(slider.min);
			slider.value = vol;
			setVolume();
		}

		difficulty.addEventListener("change", function() {
			if (songVal === -1 || audio.paused) return;
			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipEndTime = null;
				clipStartSec = clipOriginSec;
				clipTotalSec = Math.max(0.1, dur - clipOriginSec);
				if (clipRafId === null)
				{
					monitorClipProgress(playbackToken);
				}
			}
			else
			{
				const clipSec = timer / 1000;
				const endSec = Math.min(clipOriginSec + clipSec, dur - 0.03);
				if (audio.currentTime < endSec)
				{
					clipStartSec = clipOriginSec;
					clipEndTime = endSec;
					clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
					if (clipRafId === null)
					{
						monitorClipProgress(playbackToken);
					}
				}
				else
				{
					pausePlayback();
					flipIcons(false);
				}
			}
		});

		function flipIcons(startingPlayback = true) {
			if (songVal < 0) return;
			const wrap = document.getElementById("pauseWrap" + (songVal + 1));
			const spk = document.getElementById("speaker" + (songVal + 1));
			const fg = document.getElementById("ringFg" + (songVal + 1));
			if (fg) fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
			if (wrap) wrap.style.display = startingPlayback ? 'inline-flex' : 'none';
			if (spk) spk.style.display = startingPlayback ? 'none' : '';
			const slot = document.getElementById("slot" + (songVal + 1));
			if (slot) slot.classList.toggle("is-playing", Boolean(startingPlayback));
		}

		function cancelClipMonitor() {
			playbackToken++;
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearTimeout(timeRunning);
			timeRunning = null;
		}

		function monitorClipProgress(token) {
			if (token !== playbackToken || !clipPlaying || songVal < 0)
			{
				return;
			}
			if (!audio.paused && !audio.seeking)
			{
				const fg = document.getElementById("ringFg" + (songVal + 1));
				if (fg && clipTotalSec > 0)
				{
					const frac = Math.max(0, Math.min(1, (audio.currentTime - clipStartSec) / clipTotalSec));
					fg.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - frac));
				}
				if (clipEndTime !== null && audio.currentTime >= clipEndTime)
				{
					pausePlayback();
					if (songVal != -1) flipIcons(false);
					return;
				}
			}
			clipRafId = requestAnimationFrame(function() {
				monitorClipProgress(token);
			});
		}

		function loadClip(link, i) {
			if (songVal != -1 && songVal != i)
			{
				flipIcons(false);
			}

			cancelClipMonitor();
			pendingLoadToken = playbackToken;
			songVal = i;
			flipIcons(true);
			audio.src = link;
			audio.load();
		}

		function playClip(token) {
			if (token !== playbackToken) return;
			flipIcons(true);
			const onPlayError = function(err) {
				if (token === playbackToken && (!err || err.name !== "AbortError"))
				{
					pausePlayback();
					if (songVal != -1) flipIcons(false);
				}
			};

			const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
			if (difficulty.checked)
			{
				clipOriginSec = 0;
				clipStartSec = 0;
				clipEndTime = null;
				clipTotalSec = dur;
				audio.currentTime = 0;
			}
			else
			{
				const clipSec = timer / 1000;
				const maxStart = Math.max(0, dur - clipSec);
				const startSec = Math.min(timestamps[songVal] || 0, maxStart);
				clipOriginSec = startSec;
				clipStartSec = startSec;
				clipEndTime = Math.min(startSec + clipSec, dur - 0.03);
				clipTotalSec = Math.max(0.1, clipEndTime - clipStartSec);
				audio.currentTime = startSec;
			}
			clipPlaying = true;
			const playPromise = audio.play();
			if (playPromise && typeof playPromise.catch === "function")
			{
				playPromise.catch(onPlayError);
			}
			monitorClipProgress(token);
		}

		function pausePlayback() {
			clipPlaying = false;
			cancelClipMonitor();
			pendingLoadToken = -1;
			audio.pause();
		}

		function createSeededRng(initialSeed) {
			let s = initialSeed | 0;
			return function() {
				s = (s + 0x6D2B79F5) | 0;
				let t = Math.imul(s ^ (s >>> 15), 1 | s);
				t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
				return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
			};
		}

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				const needle = val.toUpperCase();
				let shown = 0;
				for (i = 0; i < arr.length && shown < MAX_AUTOCOMPLETE_RESULTS; i++) {
					if (!guessedSongs.has(arr[i]) && songsUpper[i].includes(needle)) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = buildAutocompleteItem(itemValue, val, artistBySong.get(itemValue));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						shown++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}
	</script>
</body>
</html>
