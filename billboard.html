<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Melodle Billboard</title>
	<link rel="icon" type="image/x-icon" href="img/logo.png">
	<style>
		body {
			font-family: Helvetica;
			background-color: #f6f6f6;
			overscroll-behavior: none;
			margin: 0;
			min-height: 100vh;
			display: flex;
			padding: 5vh 16px;
			box-sizing: border-box;
		}
		table {
			border-collapse: collapse;
			table-layout: fixed;
			width: 100%;

		}
		tr {
			height: 45px;
		}
		td,
		th {
			border: 1px solid #000000;
			font-size: 16px;
			padding: 5px;
		}
		a {
			cursor: pointer;
		}
		img {
			width: 35px;
			margin: auto;
			top: 5px;
			left: 5px;
			position: relative;
		}
		label {
			font-size: 13.5px;
		}
		.num-box {
			width: 10%;
			min-width: 50px;
			text-align: center;
			font-size: 18px;
		}
		.guess-box {
			padding-left: 2%;
			padding-right: 1%;
			text-align: left;
		}
		.switcher {
			display: inline-flex;
			flex-direction: row;
			padding: 10px;
			justify-content: space-between;
			flex-grow: 1;
			width: 50%;
			align-items: center;
		}
		#completed-text {
			margin: auto;
			font-size: 28px;
			text-align: center;
		}
		#header {
			display: grid;
			grid-template-columns: 4fr 1fr;
			width: 70%;
			left: 13%;
			position: relative;
			gap: 5px;
			margin-top: 3%;

			padding-left: 2%;
			padding-right: 2%;
		}
		.checkboxes {
			display: grid;
			grid-template-columns: 1fr;
			padding-top: 1%;
		}
		.new-quiz-btn-container {
			display: grid;
			grid-template-columns: 1fr;
			gap: 5px;
			align-items: center;
			justify-items: center;
		}
		.newQuizBtn {
			margin-bottom: 10px;
		}
		.category-title {
			font-weight: bold;
		}
		.checkbox-category {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 2px;
			padding-top: 1%;
			padding-bottom: 1%;

		.checkbox-set {
			display: grid;
			grid-template-columns: 0.5fr 3fr;
			align-items: center;
			gap: 5px;
		}
		.container {
			position: relative;
			margin: auto;
			display: block;
			width: 750px;
			align-content: center;
		}
		.container-columns {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
			align-items: center;
		}
		.container-row {
			width: 100%;
			padding: 5px;
			justify-content: space-between;
			align-items: center;
		}
		#title-row {
			 border-bottom: solid;
		}
		#title {
			 font-size: 60px;
			 margin: auto;
			 text-align: center;
		}
		.wrong-answer {

			width: 45px;
			height: 45px;
		}
		#new-quiz-section {
			position: absolute;
			border: 1px solid black;
			background: #D3CCCA;
			padding: 0px;

			display: grid;
			grid-template-columns: 1fr;
			align-items: center;

		.dialog-visible {

		.dialog-invisible {

		.slider-container {

		.slider {

		}

			position: static;
			cursor: pointer;
		}

			padding-top: 2%;
		}

		}

			display: grid;
			grid-template-columns: 1fr 5fr 1fr;

		.autocomplete {
			/*the container must be positioned relative:*/
			position: relative;
			display: inline-block;

		}

			border: 1px solid #000;
			background-color: #f1f1f1;

			border-bottom: none;
			z-index: 99;

			right: 0;

		}

			height: 26px;

		}
		.date-picker-wrap svg {
			width: 23px;
			height: 23px;
			pointer-events: none;
		}
		.date-picker {
			-webkit-appearance: none;
			appearance: none;
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			cursor: pointer;
			border: none;
			padding: 0;
			margin: 0;
		}
		#player-audio {
			padding: 0;
		}
		.modals {
			display: grid;
			grid-template-columns: 1fr;
			justify-items: center;
			align-items: center;
			font-size: 13px;
			line-height: 1.2;
			gap: 25px;
		}
		.modals-subcontainer {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		/* this entire section is for the difficulty toggle */

		/* The switch - the box around the slider */
		.switch {
			position: relative;
			display: inline-block;
			width: 40px;
			height: 22px;
		}
		/* Hide default HTML checkbox */
		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}
		/* The slider */
		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ccc;
		}
		.slider:before {
			position: absolute;
			content: "";
			height: 16px;
			width: 16px;
			left: 3px;
			bottom: 3px;
			background-color: white;
		}
		input:checked + .slider {
			background-color: #171717;
		}
		input:focus + .slider {
			box-shadow: 0 0 1px #171717;
		}
		input:checked + .slider:before {
			-webkit-transform: translateX(18px);
			-ms-transform: translateX(18px);
			transform: translateX(18px);
		}
		/* Rounded sliders */
		.slider.round {
			border-radius: 34px;
		}
		.slider.round:before {
			border-radius: 50%;
		}

		/* end section for difficulty toggle */
		.mode-nav {
			position: fixed;
			top: 20px;
			left: 16px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			z-index: 100;
			font-family: Helvetica, Arial, sans-serif;
		}
		.mode-nav a {
			display: block;
			padding: 7px 14px;
			border-radius: 8px;
			font-size: 13px;
			font-weight: bold;
			text-decoration: none;
			text-align: center;
			color: #191414;
			background-color: #ffffff;
			border: 1px solid #cccccc;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
			cursor: pointer;
		}
		.mode-nav a:hover {
			background-color: #e8e8e8;
		}
		.mode-nav a.active {
			background-color: #191414;
			color: #ffffff;
			border-color: #191414;
		}
		@media (max-width: 1260px) {
			body {
				flex-direction: column;
				align-items: center;
				gap: 16px;
			}
			.mode-nav {
				position: static;
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
			}
		}
	</style>
</head>

	<script type="text/javascript">
		var timestamps = [];
		var timer = 4000;
		var totalSongs = 10;
		var wrongAnswers = 0;

		let timeRunning = null;
		let playbackToken = 0;
		let pendingLoadToken = -1;
		let clipOriginSec = 0;
		let clipEndTime = null;
		let clipRafId = null;
		let clipPlaying = false;

		let json_top10 = [];
		let dates = [];

		let date = new Date();
		let activeChartDateStr = "";
		let dailyChartDateStr = "";
		let songs = [];
		let songLinkByName = new Map();
		let namesByLink = new Map();
		let guessedSongs = new Set();
		let quizSongs = [ null, null, null, null, null, null, null, null, null, null ];
		let quizNames = [ null, null, null, null, null, null, null, null, null, null ];
		let quizLinks = [ null, null, null, null, null, null, null, null, null, null ];

		let songVal = -1;

		/*
		document.addEventListener('visibilitychange', function() {
			if (document.visibilityState == 'hidden') {
				document.getElementById("pause-button").click();
			}
		});
		*/

		document.addEventListener("DOMContentLoaded", async function() {
			try {
				const response = await fetch('./jsons/data/top_10s_linked.json');
				json_top10 = await response.json();
			}
			catch(error) {
				console.error('Error:', error);
			}

			try {
				const response = await fetch('./jsons/data/chart_dates.json');
				datesJSON = await response.json();
				dates = datesJSON.dates;
			}
			catch(error) {
				console.error('Error:', error);
			}

			chart_date.max = dates.length ? dates[dates.length - 1] : formatLocalDate(new Date());
			
			const seenSongNames = new Set();
			for (const entry of json_top10)
			{
				const fullName = entry.title + ' - ' + entry.artist;
				if (!seenSongNames.has(fullName))
				{
					seenSongNames.add(fullName);
					songs.push(fullName);
				}
				if (entry.link)
				{
					if (!songLinkByName.has(fullName))
					{
						songLinkByName.set(fullName, entry.link);
					}
					if (!namesByLink.has(entry.link))
					{
						namesByLink.set(entry.link, new Set());
					}
					namesByLink.get(entry.link).add(fullName);
				}
			}

			songs.sort(sortBySongName);
			autocomplete(document.getElementById("myInput"), songs);

			quizYear = getRandomNumberFromDate();
			date = new Date(quizYear, date.getMonth(), date.getDate());
			createTopTen();
		});

		audio.addEventListener("loadedmetadata", function() {
			const token = pendingLoadToken;
			pendingLoadToken = -1;
			if (token !== playbackToken) return;
			playClip(token);
		});

		audio.addEventListener("timeupdate", function() {
			if (clipEndTime !== null && !audio.paused && !audio.seeking && audio.currentTime >= clipEndTime)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("ended", function() {
			clipPlaying = false;
			cancelClipMonitor();
			if (songVal != -1) flipIcons(false);
		});

		audio.addEventListener("error", function() {
			if (audio.getAttribute("src"))
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		audio.addEventListener("pause", function() {
			if (pendingLoadToken === -1 && clipPlaying && !audio.ended && !audio.seeking)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
			}
		});

		difficulty.addEventListener("change", function() {
			if (songVal === -1 || audio.paused) return;
			if (difficulty.checked)
			{
				clipEndTime = null;
				if (clipRafId !== null)
				{
					cancelAnimationFrame(clipRafId);
					clipRafId = null;
				}
			}
			else
			{
				const clipSec = timer / 1000;
				const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
				const endSec = Math.min(clipOriginSec + clipSec, dur - 0.03);
				if (audio.currentTime < endSec)
				{
					clipEndTime = endSec;
					if (clipRafId !== null)
					{
						cancelAnimationFrame(clipRafId);
						clipRafId = null;
					}
					monitorClipProgress(playbackToken);
				}
				else
				{
					pausePlayback();
					flipIcons(false);
				}
			}
		});

		function formatLocalDate(d) {
			const yr = d.getFullYear();
			const mo = String(d.getMonth() + 1).padStart(2, '0');
			const dy = String(d.getDate()).padStart(2, '0');
			return `${yr}-${mo}-${dy}`;
		}

		chart_date.onchange = function() {
			if (!chart_date.value || !dates.length) return;
			const parts = chart_date.value.split('-');
			const picked = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
			if (isNaN(picked.getTime())) return;
			date = picked;
			createTopTen();
		}

		function flipIcons(startingPlayback = true) {
			if (songVal < 0) return;
			document.getElementById("pauseBtn" + (songVal + 1)).style.display = startingPlayback ? '' : 'none';
			document.getElementById("speaker" + (songVal + 1)).style.display = startingPlayback ? 'none' : '';
		}

		function cancelClipMonitor() {
			playbackToken++;
			clipEndTime = null;
			if (clipRafId !== null)
			{
				cancelAnimationFrame(clipRafId);
				clipRafId = null;
			}
			clearTimeout(timeRunning);
			timeRunning = null;
		}

		function monitorClipProgress(token) {
			if (token !== playbackToken || clipEndTime === null)
			{
				return;
			}
			if (!audio.paused && !audio.seeking && audio.currentTime >= clipEndTime)
			{
				pausePlayback();
				if (songVal != -1) flipIcons(false);
				return;
			}
			clipRafId = requestAnimationFrame(function() {
				monitorClipProgress(token);
			});
		}

		function loadClip(link, i) {
			if (songVal != -1 && songVal != i)
			{
				flipIcons(false);
			}

			cancelClipMonitor();
			pendingLoadToken = playbackToken;
			songVal = i;
			flipIcons(true);
			audio.src = link;
			audio.load();
		}

		function playClip(token) {
			if (token !== playbackToken) return;
			flipIcons(true);
			const onPlayError = function(err) {
				if (token === playbackToken && (!err || err.name !== "AbortError"))
				{
					pausePlayback();
					if (songVal != -1) flipIcons(false);
				}
			};

			if (difficulty.checked)
			{
				clipOriginSec = 0;
				clipEndTime = null;
				clipPlaying = true;
				const playPromise = audio.play();
				if (playPromise && typeof playPromise.catch === "function")
				{
					playPromise.catch(onPlayError);
				}
			}
			else
			{
				const clipSec = timer / 1000;
				const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 30;
				const maxStart = Math.max(0, dur - clipSec);
				const startSec = Math.min(timestamps[songVal] || 0, maxStart);
				clipOriginSec = startSec;
				clipEndTime = Math.min(startSec + clipSec, dur - 0.03);

				audio.currentTime = startSec;
				clipPlaying = true;
				const playPromise = audio.play();
				if (playPromise && typeof playPromise.catch === "function")
				{
					playPromise.catch(onPlayError);
				}
				monitorClipProgress(token);
			}
		}

		function pausePlayback() {
			clipPlaying = false;
			cancelClipMonitor();
			pendingLoadToken = -1;
			audio.pause();
		}

		async function createTopTen() {
			if (!dates.length || isNaN(date.getTime())) return;

			const minDateStr = dates[0];
			const maxDateStr = dates[dates.length - 1];
			let dateString = formatLocalDate(date);
			if (dateString < minDateStr)
			{
				const minParts = minDateStr.split('-');
				date = new Date(Number(minParts[0]), Number(minParts[1]) - 1, Number(minParts[2]));
				dateString = minDateStr;
			}
			else if (dateString > maxDateStr)
			{
				const maxParts = maxDateStr.split('-');
				date = new Date(Number(maxParts[0]), Number(maxParts[1]) - 1, Number(maxParts[2]));
				dateString = maxDateStr;
			}
			while (!dates.includes(dateString) && dateString > minDateStr)
			{
				date.setDate(date.getDate() - 1);
				dateString = formatLocalDate(date);
			}
			chart_date.value = dateString;
			if (dateString === activeChartDateStr) return;
			activeChartDateStr = dateString;
			if (!dailyChartDateStr)
			{
				dailyChartDateStr = dateString;
			}
			document.getElementById("main-section-0").style.display = (dateString === dailyChartDateStr) ? '' : 'none';
			resetHTML();

			let dateYear = '' + date.getFullYear();
			let dateMonth = date.toLocaleString('default', { month: 'long' });
			let dateDay = '' + date.getDate();

			current_date.innerHTML = dateMonth + " " + dateDay + "<br><div class='quiz-year'>" + dateYear + "</div>";

			const seenEntries = new Set();
			const weekEntries = [];
			for (const entry of json_top10)
			{
				if (entry.date == dateString)
				{
					const entryKey = entry.rank + "\t" + entry.title + "\t" + entry.artist;
					if (!seenEntries.has(entryKey))
					{
						seenEntries.add(entryKey);
						weekEntries.push(entry);
					}
				}
			}
			weekEntries.sort(function(a, b) { return a.rank - b.rank; });

			if (weekEntries.length >= totalSongs)
			{
				for (let i = 0; i < totalSongs; i++)
				{
					const entry = weekEntries[i];
					quizSongs[i] = entry;
					quizNames[i] = entry.title + ' - ' + entry.artist;
					quizLinks[i] = entry.link;
					document.getElementById("num" + (i + 1)).innerText = entry.rank + ".";
				}
			}
			else
			{
				const overflow = [];
				for (const entry of weekEntries)
				{
					const idx = entry.rank - 1;
					if (idx >= 0 && idx < totalSongs && quizSongs[idx] === null)
					{
						quizSongs[idx] = entry;
						quizNames[idx] = entry.title + ' - ' + entry.artist;
						quizLinks[idx] = entry.link;
						document.getElementById("num" + (idx + 1)).innerText = entry.rank + ".";
					}
					else
					{
						overflow.push(entry);
					}
				}
				for (const entry of overflow)
				{
					const openIdx = quizSongs.indexOf(null);
					if (openIdx !== -1)
					{
						quizSongs[openIdx] = entry;
						quizNames[openIdx] = entry.title + ' - ' + entry.artist;
						quizLinks[openIdx] = entry.link;
						document.getElementById("num" + (openIdx + 1)).innerText = entry.rank + ".";
					}
				}
			}
			
			const chartRng = createSeededRng(Number(dateString.replace(/-/g, '')));
			for (let i = 0; i < quizSongs.length; i++)
			{
															// length of Spotify previews
				timestamps.push(Math.floor(chartRng() * (30 - (timer / 1000))));

				const songBox = document.getElementById("guess" + (i + 1));
				const songTitleBox = document.createElement("div");
				songTitleBox.classList.add('answer-box');
				songTitleBox.id = "answerBox" + (i + 1);
				const blankContainer = document.createElement("div");
				const blank = document.createElement("text");
				blank.id = "guessText" + (i + 1);

				const speakerIcon = document.createElement("img");
				speakerIcon.src = "img/speaker.png";
				speakerIcon.classList.add("inline-img");
				speakerIcon.id = "speaker" + (i + 1);
				if (quizSongs[i] && quizSongs[i].link)
				{
					speakerIcon.onclick = function () {
						loadClip(quizSongs[i].link, i);
					};
				}
				else
				{
					speakerIcon.style.opacity = "0.3";
					speakerIcon.style.cursor = "not-allowed";
					speakerIcon.title = "No audio preview available";
					if (quizSongs[i])
					{
						blank.innerText = quizNames[i];
						blank.style.color = "#888";
						blank.title = "No audio preview available";
						guessedSongs.add(quizNames[i]);
					}
				}

				const pauseBtn = document.createElement("img");
				pauseBtn.id = "pauseBtn" + (i + 1);
				pauseBtn.src = "img/clear_pause.png";
				pauseBtn.classList.add("inline-img");
				pauseBtn.onclick = function () {
					flipIcons(false);
					pausePlayback();
				};
				pauseBtn.style.display = 'none';

				blankContainer.appendChild(blank);
				songTitleBox.appendChild(blankContainer);
				songTitleBox.appendChild(speakerIcon);
				songTitleBox.appendChild(pauseBtn);

				songBox.appendChild(songTitleBox);
			}
		}

		function sortBySongName(a, b) {
			return a.localeCompare(b, undefined, { sensitivity: 'base' });
		}

		function giveUp() {
			if (!quizSongs.some(Boolean)) return;
			pausePlayback();
			if (songVal != -1)
			{
				flipIcons(false);
			}
			let validSongs = 0;
			let songsFound = 0;

			for (let i = 0; i < totalSongs; i++)
			{
				if (!quizSongs[i] || !quizSongs[i].link) continue;
				validSongs++;
				let songTitleText = document.getElementById("guessText" + (i + 1));

				if (songTitleText.innerText == "")
				{
					songTitleText.innerText = quizNames[i];
					songTitleText.style.color = "red";
					songTitleText.style.fontWeight = "bold";
				}
				else
				{
					songsFound++;
				}

				songTitleText.style.cursor = "pointer";
			}

			document.getElementById("game-over-section-1").innerHTML = (validSongs > 0 && songsFound === validSongs) ? "<b>YOU WIN</b>" : "<b>GAME OVER</b>";
			document.getElementById("game-over-section-1").style.display = 'block';
			document.getElementById("game-over-section-2").style.display = 'block';
			document.getElementById("main-section-2").style.display = 'none';
			document.getElementById("main-section-3").style.display = 'none';
			document.getElementById("game-over-section-2").innerText = "" + songsFound + " of " + validSongs + " songs found.";
			document.getElementById("giveUpBtn").disabled = true;
		}

		function checkAnswer() {
			input = document.getElementById('myInput').value;

			if (songs.includes(input))
			{
				document.getElementById('myInput').value = '';
				if (guessedSongs.has(input))
				{
					return;
				}
				guessedSongs.add(input);

				let matchIdx = quizNames.indexOf(input);
				if (matchIdx === -1)
				{
					const guessedLink = songLinkByName.get(input);
					if (guessedLink)
					{
						for (let i = 0; i < totalSongs; i++)
						{
							if (quizSongs[i] && quizSongs[i].link === guessedLink && document.getElementById("guessText" + (i + 1)).innerText == "")
							{
								matchIdx = i;
								break;
							}
						}
					}
				}
				if (matchIdx !== -1)
				{
					const matchedName = quizNames[matchIdx];
					guessedSongs.add(matchedName);
					document.getElementById("guessText" + (matchIdx + 1)).innerText = matchedName;
					const matchedLink = quizSongs[matchIdx] && quizSongs[matchIdx].link;
					if (matchedLink && namesByLink.has(matchedLink))
					{
						let anotherRowUsesLink = false;
						for (let j = 0; j < totalSongs; j++)
						{
							if (j !== matchIdx && quizSongs[j] && quizSongs[j].link === matchedLink && document.getElementById("guessText" + (j + 1)).innerText == "")
							{
								anotherRowUsesLink = true;
								break;
							}
						}
						if (!anotherRowUsesLink)
						{
							namesByLink.get(matchedLink).forEach(function(siblingName) {
								guessedSongs.add(siblingName);
							});
						}
					}

					l1: while (true)
					{
						for (let i = 0; i < totalSongs; i++)
						{
							if (quizSongs[i] && document.getElementById("guessText" + (i + 1)).innerText == "")
							{
								break l1;
							}
						}

						pausePlayback();
						if (songVal != -1) flipIcons(false);
						document.getElementById("game-over-section-1").innerHTML = "<b>YOU WIN</b>";
						document.getElementById("game-over-section-1").style.display = 'block';
						document.getElementById("game-over-section-2").style.display = 'block';
						document.getElementById("main-section-2").style.display = 'none';
						document.getElementById("main-section-3").style.display = 'none';
						document.getElementById("game-over-section-2").innerText = "All songs found!";
						document.getElementById("giveUpBtn").disabled = true;
						break
					}
				}
				else
				{
					wrongAnswers++;
					let xImg = document.createElement("img");
					xImg.src = "img/x.png";
					document.getElementById("wrong-answer-" + wrongAnswers).appendChild(xImg);

					if (wrongAnswers == 5)
					{
						giveUp();
					}
				}
			}
		}

		function parseStringToJsonToArrays(str) {
			const fileJSON = JSON.parse(str.toString());

			tmpArr = [];

			for (let i of fileJSON)
			{
				if (i.trackLink)
				{
					tmpArr.push([i.title + " - " + i.artist, i.preview.replace("\\/", "/"), i.trackLink.replace("\\/", "/")]);
				}
			}

			return tmpArr;
		}

		function resetHTML() {
			clipPlaying = false;
			cancelClipMonitor();
			pendingLoadToken = -1;
			audio.pause();
			songVal = -1;
			
			timestamps = [];
			
			wrongAnswers = 0;
			guessedSongs.clear();

			document.getElementById("myInput").value = "";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });

			for (let i = 1; i <= 5; i++)
			{
				document.getElementById("wrong-answer-" + i).innerHTML = "";
			}

			quizSongs = [ null, null, null, null, null, null, null, null, null, null ];
			quizNames = [ null, null, null, null, null, null, null, null, null, null ];
			quizLinks = [ null, null, null, null, null, null, null, null, null, null ];

			for (let i = 0; i < totalSongs; i++)
			{
				document.getElementById("num" + (i + 1)).innerText = (i + 1) + ".";
				songBox = document.getElementById("guess" + (i + 1));
				songBox.innerHTML = "";
			}

			document.getElementById("game-over-section-1").style.display = 'none';
			document.getElementById("game-over-section-2").style.display = 'none';
			document.getElementById("main-section-2").style.display = 'flex';
			document.getElementById("main-section-3").style.display = 'grid';

			document.getElementById("giveUpBtn").disabled = false;
		}

		function createSeededRng(initialSeed) {
			let s = initialSeed | 0;
			return function() {
				s = (s + 0x6D2B79F5) | 0;
				let t = Math.imul(s ^ (s >>> 15), 1 | s);
				t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
				return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
			};
		}

		function generateSeededRandom(seed) {
			return createSeededRng(seed)();
		}

		function getRandomNumberFromDate() {
			const now = new Date();
			let min = 1958;
			if (now.getMonth() < 7 || (now.getMonth() === 7 && now.getDate() < 4))
			{
				min = 1959;
			}
			let max = now.getFullYear();
			if (dates.length)
			{
				const lastDateStr = dates[dates.length - 1];
				const lastParts = lastDateStr.split('-');
				const lastYear = Number(lastParts[0]);
				const candidateThisLastYear = formatLocalDate(new Date(lastYear, now.getMonth(), now.getDate()));
				max = (candidateThisLastYear <= lastDateStr) ? lastYear : (lastYear - 1);
			}
			const date_string_int = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
			
			const range = max - min;
			const random = generateSeededRandom(date_string_int);
			const random_year = Math.floor(random * (range + 1)) + min;

			return random_year;
		}

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				searchResults = 0;
				for (i = 0; i < arr.length; i++) {
					if (!guessedSongs.has(arr[i]) && arr[i].toUpperCase().includes(val.toUpperCase())) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = document.createElement("DIV");
						index = itemValue.toUpperCase().indexOf(val.toUpperCase());
						b.appendChild(document.createTextNode(itemValue.substr(0, index)));
						const strongEl = document.createElement("STRONG");
						strongEl.textContent = itemValue.substr(index, val.length);
						b.appendChild(strongEl);
						b.appendChild(document.createTextNode(itemValue.substr(index + val.length)));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						searchResults++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}
	</script>
