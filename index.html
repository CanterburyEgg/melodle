</head>

<body>

		<a href="index.html" class="active">Daily Melodle</a>

	</nav>
	<div class="container">
		<div id="decades" role="navigation" aria-label="Playlist filters">
			<a href="#" data-playlist="startup-playlist" onclick="event.preventDefault();switchPlaylist('startup-playlist')">Most Streamed</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="1960s" onclick="event.preventDefault();switchPlaylist('1960s')">1960s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="1970s" onclick="event.preventDefault();switchPlaylist('1970s')">1970s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="1980s" onclick="event.preventDefault();switchPlaylist('1980s')">1980s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="1990s" onclick="event.preventDefault();switchPlaylist('1990s')">1990s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="2000s" onclick="event.preventDefault();switchPlaylist('2000s')">2000s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="2010s" onclick="event.preventDefault();switchPlaylist('2010s')">2010s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="2020s" onclick="event.preventDefault();switchPlaylist('2020s')">2020s</a><span class="decade-sep" aria-hidden="true">•</span><a href="#" data-playlist="billboard-no-1s" onclick="event.preventDefault();switchPlaylist('billboard-no-1s')">Billboard #1 Hits</a>
		</div>

		<header class="masthead" id="title-row">
			<div class="masthead-clickable" id="header" role="button" tabindex="0" onclick="switchPlaylist('startup-playlist')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchPlaylist('startup-playlist');}" title="Switch to Spotify's Most Streamed">
				<img src="img/logo.png" class="masthead-logo" alt="Melodle logo">
				<h1>Melodle</h1>
			</div>
		</header>

		<div class="daily-meta-bar" id="main-section-1">
			<div class="playlist-meta">
				<div id="playlist">
					<span class="meta-eyebrow">Current Playlist</span>
					<div id="playlist-name">Spotify's Most Streamed</div>
				</div>
				<div class="playlist-actions">
					<button type="button" class="btn-secondary" id="setplaylist" onclick="uploadPlaylist()">Upload Playlist</button>
					<div class="popup">
						<button type="button" class="help-btn" id="qmark" onclick="showPopup()" aria-label="How to upload a custom playlist">?</button>
						<span class="popuptext" id="myPopup">Use a site like <a href="https://www.soundiiz.com" target="_blank" rel="noopener">Soundiiz</a> to convert your Spotify playlist to JSON, then upload it here for a custom Melodle game!</span>
					</div>
				</div>
			</div>
			<div class="date-controls">
				<div class="date-text" id="currentDate"></div>
				<div class="songpicker">
					<div class="date-picker-wrap" title="Pick a date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><input type="hidden" class="date-picker" id="datepicker" min="2025-08-27" aria-label="Pick a date"/></div>
					<div class="prev-next-btns">
						<button type="button" class="icon-btn nav-chevron-btn" id="prev" aria-label="Previous day" title="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
						<button type="button" class="icon-btn nav-chevron-btn" id="next" aria-label="Next day" title="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
					</div>
				</div>
			</div>
		</div>

		<div class="daily-slots" id="main-section-2">
			<div class="daily-slot is-current" id="slot1"><div class="x-box" id="x1">1</div><div class="guess-box" id="guess1"></div></div>
			<div class="daily-slot" id="slot2"><div class="x-box" id="x2">2</div><div class="guess-box" id="guess2"></div></div>
			<div class="daily-slot" id="slot3"><div class="x-box" id="x3">3</div><div class="guess-box" id="guess3"></div></div>
			<div class="daily-slot" id="slot4"><div class="x-box" id="x4">4</div><div class="guess-box" id="guess4"></div></div>
			<div class="daily-slot" id="slot5"><div class="x-box" id="x5">5</div><div class="guess-box" id="guess5"></div></div>
			<div class="daily-slot" id="slot6"><div class="x-box" id="x6">6</div><div class="guess-box" id="guess6"></div></div>
		</div>

		<div id="main-section-completed">
			<div id="completed-text"></div>
		</div>

		<div id="player-iframe">
			<div id="embed-iframe"></div>
		</div>

		<div class="daily-player-dock" id="main-section-3">
			<div class="auto-container" autocomplete="off">
				<div class="autocomplete autocomplete-up">
					<input id="myInput" type="text" name="myInput" placeholder="Type a song name ...">
					<button type="button" class="submit" onclick="checkAnswer()" aria-label="Submit guess"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
				</div>
			</div>
			<button type="button" class="icon-btn primary daily-play-btn" id="play-button" aria-label="Play clip"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"></polygon></svg></button>
			<button type="button" class="btn-secondary skip-btn" onclick="skip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg><span>Skip</span></button>
		</div>

		<div id="main-section-4">
			<div id="progressbar"></div>
		</div>
	</div>

	<script src="theme.js"></script>
	<script type="text/javascript">
		var links = [];
		var songs = [];
		var baseLinks = [];
		var baseSongs = [];
		var loadedCycles = 0;
		var controller = null;
		var timer = 2000;
		var songVisible = false;
		var playing = false;
		var increment = 1000;
		var guess = 1;
		var songVal = 0;
		var timeout = null;
		var timestamp = 0;
		var clipStarted = false;
		var clipStartPos = 0;
		var remainingMs = 0;
		var lastResumeTime = 0;
		var lastKnownPosition = 0;
		var awaitingZeroSeek = false;
		var seekRequestTime = 0;
		var seekRetried = false;
		var date = new Date();
		date.setHours(0, 0, 0, 0);
		var datePickerInitialized = false;
		let playlistGeneration = 0;
		let artistBySong = new Map();
		const dateParts = '2025-08-27'.split('-');
		const firstDay = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
		firstDay.setHours(0, 0, 0, 0);
		const defaultPlaylist = 'startup-playlist';
		const url = new URL(window.location.href);
		const urlParams = new URLSearchParams(url.search);

		function ensureSongsUpTo(targetIdx) {
			if (!baseSongs.length) return;
			while (songs.length <= targetIdx)
			{
				const seed = getDailySeed(firstDay) + loadedCycles;
				songs.push(...shuffleArraySeeded(baseSongs, seededRandomFunc(seed)));
				links.push(...shuffleArraySeeded(baseLinks, seededRandomFunc(seed)));
				loadedCycles++;
			}
		}

		function initDatePicker() {
			if (datePickerInitialized) return;
			datePickerInitialized = true;
			setMinAndMaxDates('datepicker');

			document.querySelectorAll('.date-picker').forEach(
				x => {
					let today = getFormattedDate(new Date());
					x.value = today;
					updatePrevNextBtns();
					let dateparts = today.split('-');
					date = new Date(dateparts[0], dateparts[1] - 1, dateparts[2]);
					songVal = getSongDay(date);
					currentDate.innerHTML = date.toLocaleString('default', { month: 'long' }) + " " + date.getDate() + "<br><div class='quiz-year'>" + date.getFullYear() + "</div>";

					x.addEventListener('change', () => {
						if (!x.value) return;
						let dp = x.value.split('-');
						let picked = new Date(Number(dp[0]), Number(dp[1]) - 1, Number(dp[2]));
						if (isNaN(picked.getTime())) return;
						const todayDate = new Date();
						todayDate.setHours(0, 0, 0, 0);
						if (picked < firstDay) picked = new Date(firstDay);
						if (picked > todayDate) picked = new Date(todayDate);
						x.value = getFormattedDate(picked);
						date = picked;
						resetHTML();
						updatePrevNextBtns();
						currentDate.innerHTML = date.toLocaleString('default', { month: 'long' }) + " " + date.getDate() + "<br><div class='quiz-year'>" + date.getFullYear() + "</div>";
						songVal = getSongDay(date);
						ensureSongsUpTo(songVal);

						if (controller && links[songVal])
						{
							controller.loadUri(links[songVal]);
						}
					});
				}
			);
		}

		window.onSpotifyIframeApiReady = (IFrameAPI) => {
			initDatePicker();

			const element = document.getElementById('embed-iframe');
			const options = {
				width: '100%',
				height: 152
			};
			const callback = (EmbedController) => {
				controller = EmbedController;

				EmbedController.addListener('playback_update', e => {
					lastKnownPosition = e.data.position || 0;
					if (!songVisible && !playing && e.data.isPaused && e.data.position !== 0)
					{
						awaitingZeroSeek = false;
						if (typeof controller.seek !== 'function' && links[songVal])
						{
							lastKnownPosition = 0;
							controller.loadUri(links[songVal]);
						}
						return;
					}

					if (!songVisible && !playing && !e.data.isPaused)
					{
						if (typeof controller.pause === 'function')
						{
							controller.pause();
						}
						return;
					}

					if (!playing || songVisible)
					{
						return;
					}

					if (awaitingZeroSeek)
					{
						const pos = e.data.position || 0;
						const elapsedSinceSeek = performance.now() - seekRequestTime;
						if (pos === 0 || (!e.data.isPaused && pos < timer && pos <= elapsedSinceSeek + 250))
						{
							awaitingZeroSeek = false;
							seekRetried = false;
						}
						else
						{
							if (!e.data.isPaused && !seekRetried && elapsedSinceSeek > 400 && pos > elapsedSinceSeek + 250)
							{
								seekRetried = true;
								seekRequestTime = performance.now();
								if (typeof controller.seek === 'function')
								{
									controller.seek(0);
								}
								else if (links[songVal])
								{
									controller.loadUri(links[songVal]);
									controller.play();
								}
							}
							else if (pos >= timer && elapsedSinceSeek > 500)
							{
								resetPlayState();
							}
							return;
						}
					}

					const activelyPlaying = !e.data.isPaused && !e.data.isBuffering && e.data.position > 0;

					if (!clipStarted)
					{
						if (activelyPlaying)
						{
							if (e.data.position >= timer)
							{
								if (typeof controller.seek === 'function')
								{
									awaitingZeroSeek = true;
									seekRequestTime = performance.now();
									controller.seek(0);
								}
								else if (links[songVal])
								{
									controller.loadUri(links[songVal]);
									controller.play();
								}
								return;
							}
							clipStarted = true;
							clipStartPos = 0;
							remainingMs = Math.max(100, timer - e.data.position);
							lastResumeTime = performance.now();

							createProgressbar('progressbar', (remainingMs / 1000).toString() + 's');
							timeout = setTimeout(function() {
								resetPlayState();
							}, remainingMs);
						}
					}
					else
					{
						if (e.data.position >= timer)
						{
							resetPlayState();
							return;
						}

						if (e.data.isBuffering || e.data.isPaused)
						{
							if (timeout)
							{
								clearTimeout(timeout);
								timeout = null;
								remainingMs = Math.max(50, remainingMs - (performance.now() - lastResumeTime));
								const inner = document.querySelector('#progressbar .inner');
								if (inner) inner.style.animationPlayState = 'paused';
							}
						}
						else if (!timeout)
						{
							lastResumeTime = performance.now();
							const inner = document.querySelector('#progressbar .inner');
							if (inner) inner.style.animationPlayState = 'running';
							timeout = setTimeout(function() {
								resetPlayState();
							}, remainingMs);
						}
					}
				});
				EmbedController.addListener('playback_started', e => {
					if (!songVisible && playing)
					{
						const playBtn = document.getElementById("play-button");
						playBtn.innerHTML = MELODLE_ICONS.stop;
						playBtn.setAttribute("aria-label", "Stop clip");
						playBtn.addEventListener('click', resetPlayState);
					}
				});

				document.getElementById("play-button").addEventListener('click', playAudio);

				if (links[songVal])
				{
					EmbedController.loadUri(links[songVal]);
				}
			};

			IFrameAPI.createController(element, options, callback);
		};

		function setMinAndMaxDates(datepicker) {
			document.getElementById(datepicker).setAttribute('min', getFormattedDate(firstDay));

			const today = new Date();
			document.getElementById(datepicker).setAttribute('max', getFormattedDate(today));
		}

		function updatePrevNextBtns() {
			if (datepicker.value >= getFormattedDate(new Date()))
			{
				next.classList.add("is-disabled");
				next.disabled = true;
				next.removeEventListener('click', nextDay);
			}
			else
			{
				next.classList.remove("is-disabled");
				next.disabled = false;
				next.addEventListener('click', nextDay);
			}
			if (datepicker.value <= getFormattedDate(firstDay))
			{
				prev.classList.add("is-disabled");
				prev.disabled = true;
				prev.removeEventListener('click', previousDay);
			}
			else
			{
				prev.classList.remove("is-disabled");
				prev.disabled = false;
				prev.addEventListener('click', previousDay);
			}
		}

		function previousDay() {
			incrementDay(-1);
		}

		function nextDay() {
			incrementDay(1);
		}

		function incrementDay(x) {
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			let tmpDate = new Date(date.getFullYear(), date.getMonth(), date.getDate() + x);
			if (tmpDate < firstDay) tmpDate = new Date(firstDay);
			if (tmpDate > today) tmpDate = today;
			datepicker.value = getFormattedDate(tmpDate);
			datepicker.dispatchEvent(new Event('change'));
		}

		function getSongDay(date) {
			const utcTarget = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
			const utcStart = Date.UTC(firstDay.getFullYear(), firstDay.getMonth(), firstDay.getDate());
			return Math.max(0, Math.round((utcTarget - utcStart) / 86400000));
		}

		function getFormattedDate(date) {
			const year = date.getFullYear();
			const month = String(date.getMonth() + 1).padStart(2, '0');
			const day = String(date.getDate()).padStart(2, '0');
			return `${year}-${month}-${day}`;
		}

		function switchPlaylist(listName) {
			if (songVisible && controller && typeof controller.pause === 'function')
			{
				controller.pause();
			}
			resetPlayState();
			setDailySongVal(firstDay, listName, true);
		}

		window.addEventListener("popstate", function() {
			if (songVisible && controller && typeof controller.pause === 'function')
			{
				controller.pause();
			}
			resetPlayState();
			setDailySongVal(firstDay, null, false);
		});

		function playAudio() {
			if (!controller || !links[songVal]) return;
			const playBtn = document.getElementById("play-button");
			playBtn.removeEventListener('click', playAudio);
			playBtn.innerHTML = MELODLE_ICONS.stop;
			playBtn.setAttribute("aria-label", "Stop clip");
			playBtn.addEventListener('click', resetPlayState);
			clipStarted = false;
			clipStartPos = 0;
			remainingMs = timer;
			playing = true;
			awaitingZeroSeek = false;
			seekRetried = false;
			if (lastKnownPosition > 0)
			{
				if (typeof controller.restart === 'function')
				{
					awaitingZeroSeek = true;
					seekRequestTime = performance.now();
					controller.restart();
					return;
				}
				if (typeof controller.seek === 'function')
				{
					awaitingZeroSeek = true;
					seekRequestTime = performance.now();
					controller.seek(0);
				}
			}
			if (typeof controller.play === 'function')
			{
				controller.play();
			}
			else
			{
				controller.togglePlay();
			}
		}

		function seededRandomFunc(seed) {
		    const m = 0x80000000;
		    const a = 1103515245;
		    const c = 12345;
		    let state = seed;

		    return function() {
		        state = (a * state + c) % m;
		        return state / m;
		    };
		}

		function getDailySeed(date) {
		    return date.getFullYear() * 10000 + date.getMonth() * 100 + date.getDate();
		}

		function shuffleArraySeeded(array, randomFunc) {
		    const shuffledArray = [...array];
		    let currentIndex = shuffledArray.length, randomIndex;

		    while (currentIndex !== 0) {
		        randomIndex = Math.floor(randomFunc() * currentIndex);
		        currentIndex--;

		        [shuffledArray[currentIndex], shuffledArray[randomIndex]] = [
		            shuffledArray[randomIndex], shuffledArray[currentIndex]];
		    }

		    return shuffledArray;
		}

		function resetPlayState()
		{
			if (timeout)
			{
				clearTimeout(timeout);
				timeout = null;
			}
			clipStarted = false;
			awaitingZeroSeek = false;
			seekRetried = false;
			if (playing)
			{
				playing = false;
				if (controller)
				{
					if (typeof controller.pause === 'function')
					{
						controller.pause();
					}
					else
					{
						controller.togglePlay();
					}
				}
			}

			document.getElementById('progressbar').innerHTML = "";
			const playBtn = document.getElementById("play-button");
			playBtn.removeEventListener('click', resetPlayState);
			playBtn.innerHTML = MELODLE_ICONS.play;
			playBtn.setAttribute("aria-label", "Play clip");
			playBtn.addEventListener('click', playAudio);
		}

		function syncActiveDecadePill(activePlaylist) {
			document.querySelectorAll('#decades a[data-playlist]').forEach(function(a) {
				a.classList.toggle('active-decade', a.getAttribute('data-playlist') === activePlaylist);
			});
		}

		function updateActiveSlot() {
			for (let i = 1; i <= 6; i++)
			{
				const slot = document.getElementById('slot' + i);
				if (slot) slot.classList.toggle('is-current', !songVisible && i === guess);
			}
		}

		async function setDailySongVal(fDay = firstDay, playlist = null, pushHistory = false) {
			initDatePicker();
			const gen = ++playlistGeneration;
			const currentUrl = new URL(window.location.href);

			let playlistTitles = {};
			try {
				const names = await fetch('jsons/names-to-jsons.txt');
				if (!names.ok) return;
				const ntjText = await names.text();
				if (gen !== playlistGeneration) return;
				const ntjSplit = ntjText.split('\n');
				for (const ntj of ntjSplit)
				{
					const ntjParts = ntj.split('\t');
					if (ntjParts[0] && ntjParts[1])
					{
						playlistTitles[ntjParts[0].trim()] = ntjParts[1].trim();
					}
				}
			} catch (err) {
				console.error('Failed to load playlist index:', err);
				return;
			}

			if (playlist === null)
			{
				const requested = currentUrl.searchParams.get("playlist");
				playlist = (requested && Object.prototype.hasOwnProperty.call(playlistTitles, requested)) ? requested : defaultPlaylist;
			}

			if (playlist != defaultPlaylist)
			{
				currentUrl.searchParams.set("playlist", playlist);
			}
			else
			{
				currentUrl.searchParams.delete("playlist");
			}
			if (currentUrl.href !== window.location.href)
			{
				if (pushHistory)
				{
					history.pushState({}, "", currentUrl);
				}
				else
				{
					history.replaceState({}, "", currentUrl);
				}
			}

			try {
				const file = await fetch(`jsons/${playlist}.json`);
				if (!file.ok) return;
				var fileText = await file.text();
				if (gen !== playlistGeneration) return;
				if (!parseStringToJsonToArrays(fileText, false)) return;
			} catch (err) {
				console.error('Failed to load playlist JSON:', err);
				return;
			}

			resetHTML();
			baseSongs = songs.slice();
			baseLinks = links.slice();
			loadedCycles = 0;
			songs = [];
			links = [];
			ensureSongsUpTo(songVal);

			// now with alphabetical powers
			let sortedSongs = Array.from(new Set(baseSongs));
			sortedSongs.sort(sortBySongName);
			autocomplete(document.getElementById("myInput"), sortedSongs);

			document.getElementById('playlist-name').innerText = (playlist === defaultPlaylist) ? "Spotify's Most Streamed" : (playlistTitles[playlist] || playlist);
			syncActiveDecadePill(playlist);

			currentDate.innerHTML = date.toLocaleString('default', { month: 'long' }) + " " + date.getDate() + "<br><div class='quiz-year'>" + date.getFullYear() + "</div>";

			if (controller && links[songVal])
			{
				controller.loadUri(links[songVal]);
			}
		}

		function sortBySongName(a, b) {
			return a.localeCompare(b, undefined, { sensitivity: 'base' });
		}

		function showPopup() {
			var popup = document.getElementById("myPopup");
			popup.classList.toggle("show");
		}

		document.addEventListener("click", function(e) {
			const popup = document.getElementById("myPopup");
			if (popup && popup.classList.contains("show") && !e.target.closest(".popup"))
			{
				popup.classList.remove("show");
			}
		});

		function uploadPlaylist() {
			let input = document.createElement('input');
			input.type = 'file';
			input.accept = '.json';
			input.onchange = _ => {
				let file = input.files[0];
				if (!file) return;
				let reader = new FileReader();

				reader.onload = function() {
					try {
						if (!parseStringToJsonToArrays(reader.result, false)) return;
					} catch (err) {
						console.error('Invalid playlist JSON:', err);
						return;
					}

					++playlistGeneration;
					resetHTML();
					const cleanUrl = new URL(window.location.href);
					cleanUrl.searchParams.delete("playlist");
					if (cleanUrl.href !== window.location.href)
					{
						history.pushState({}, "", cleanUrl);
					}

					baseSongs = songs.slice();
					baseLinks = links.slice();
					loadedCycles = 0;
					songs = [];
					links = [];
					ensureSongsUpTo(songVal);

					let sortedSongs = Array.from(new Set(baseSongs));
					sortedSongs.sort(sortBySongName);
					autocomplete(document.getElementById("myInput"), sortedSongs);

					document.getElementById('playlist-name').innerText = file.name.replace(/\.json$/i, '');
					syncActiveDecadePill(null);
					if (controller && links[songVal])
					{
						controller.loadUri(links[songVal]);
					}
				};

				reader.readAsText(file);
			};
			input.click();
		}

		function parseStringToJsonToArrays(str, rand) {
			const fileJSON = JSON.parse(str.toString());
			if (!Array.isArray(fileJSON))
			{
				throw new Error("Playlist JSON must be an array");
			}

			let tmpArr = [];

			for (let i of fileJSON)
			{
				if (i && i.trackLink)
				{
					let trackUri = i.trackLink.replace("\\/", "/");
					if (trackUri.includes("open.spotify.com/track/")) {
						let trackId = trackUri.split("track/")[1].split("?")[0];
						trackUri = "spotify:track:" + trackId;
					}
					tmpArr.push({
						"songStats": i.title + " - " + i.artist,
						"artist": String(i.artist || ""),
						"trackLink": trackUri
					});
				}
			}

			if (!tmpArr.length)
			{
				return false;
			}

			if (rand)
			{
				tmpArr = shuffle(tmpArr);
			}

			songs = [];
			links = [];
			artistBySong = new Map();
			for (let i = 0; i < tmpArr.length; i++)
			{
				songs.push(tmpArr[i].songStats);
				links.push(tmpArr[i].trackLink);
				artistBySong.set(tmpArr[i].songStats, tmpArr[i].artist);
			}
			return true;
		}

		function shuffle(array) {
			let currentIndex = array.length, randomIndex;

	  		// While there remain elements to shuffle.
			while (currentIndex != 0) {

	   		// Pick a remaining element.
			randomIndex = Math.floor(Math.random() * currentIndex);
			currentIndex--;

	    	// And swap it with the current element.
			[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
			}

			return array;
		}

		function resetHTML() {
			if (songVisible && controller && typeof controller.pause === 'function')
			{
				controller.pause();
			}
			resetPlayState();
			lastKnownPosition = 0;

			document.getElementById("myInput").value = "";
			document.querySelectorAll(".autocomplete-items").forEach(function(el) { el.remove(); });

			guess = 1;
			timer = 2000;
			increment = 1000;

			for (let i = 1; i <= 6; i++)
			{
				document.getElementById('guess' + i).innerHTML = "";
				document.getElementById('x' + i).textContent = String(i);
				const slot = document.getElementById('slot' + i);
				if (slot) slot.className = 'daily-slot';
			}

			document.getElementById('main-section-3').style.display = 'flex';
			document.getElementById('main-section-4').style.display = 'flex';
			document.getElementById('main-section-completed').style.display = 'none';
			document.getElementById('player-iframe').style.width = '0';
			document.getElementById('player-iframe').style.height = '0';
			document.getElementById('player-iframe').style.overflow = 'hidden';
			document.getElementById('player-iframe').style.padding = '0';

			songVisible = false;
			updateActiveSlot();
		}

		function createProgressbar(id, duration, callback) {
			var progressBar = document.getElementById(id);
			progressBar.innerHTML = '';
			progressBar.className = 'progressbar';

			var progressBarInner = document.createElement('div');
			progressBarInner.className = 'inner';

			progressBarInner.style.animationDuration = duration;

			if (typeof(callback) === 'function') {
				progressBarInner.addEventListener('animationend', callback);
			}

			progressBar.appendChild(progressBarInner);
			progressBarInner.style.animationPlayState = 'running';
		}

		function displayCorrectSong() {
			resetPlayState();
			songVisible = true;
			lastKnownPosition = 0;
			updateActiveSlot();

			if (controller && links[songVal])
			{
				controller.loadUri(links[songVal]);
			}

			document.getElementById('player-iframe').style.width = '100%';
			document.getElementById('player-iframe').style.height = 'auto';
			document.getElementById('player-iframe').style.overflow = 'visible';
			document.getElementById('player-iframe').style.padding = '0';
			document.getElementById('main-section-completed').style.display = 'flex';
			document.getElementById('main-section-3').style.display = 'none';
			document.getElementById('main-section-4').style.display = 'none';
		}

		function checkForSimilarArtist(str1, str2) {
			const COMMA_ARTISTS = [
				"earth, wind & fire",
				"tyler, the creator",
				"crosby, stills, nash & young",
				"crosby, stills & nash",
				"blood, sweat & tears",
				"emerson, lake & palmer",
				"peter, paul and mary",
				"10,000 maniacs"
			];
			const extractArtists = function(s) {
				let raw = "";
				if (artistBySong.has(s))
				{
					raw = artistBySong.get(s);
				}
				else
				{
					const sep = s.lastIndexOf(' - ');
					if (sep === -1) return [];
					raw = s.slice(sep + 3);
				}
				let norm = raw.normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC").toLowerCase();
				const found = [];
				for (const ca of COMMA_ARTISTS)
				{
					if (norm.includes(ca))
					{
						found.push(ca);
						norm = norm.split(ca).join(",");
					}
				}
				for (const part of norm.split(","))
				{
					const trimmed = part.trim();
					if (trimmed) found.push(trimmed);
				}
				return found;
			};

			const artists1 = extractArtists(str1);
			const artists2 = extractArtists(str2);
			return artists1.some(function(a) { return artists2.includes(a); });
		}

		function skip() {
			if (!songs.length || songVisible) return;
			resetPlayState();

			document.getElementById('myInput').value = "";
			document.getElementById('guess' + guess).textContent = "Skipped";
			document.getElementById('x' + guess).innerHTML = MELODLE_ICONS.x;
			document.getElementById('slot' + guess).classList.add('slot-skipped');
			if (guess == 6)
			{
				displayCorrectSong();
				document.getElementById('completed-text').innerHTML = "<b>Oh no!</b><br/>Better luck on the next Melodle!";
			}
			else
			{
				timer = timer + increment;
				increment = increment + 1000;
				guess++;
				updateActiveSlot();
			}
		}

		function checkAnswer() {
			input = document.getElementById('myInput').value;

			if (songs.includes(input))
			{
				resetPlayState();
				document.getElementById('myInput').value = "";
				setFormattedSongText(document.getElementById('guess' + guess), input, artistBySong.get(input));

				if (songs[songVal] == input)
				{
					document.getElementById('slot' + guess).classList.add('slot-correct');
					document.getElementById('x' + guess).innerHTML = MELODLE_ICONS.check;
					displayCorrectSong();
					document.getElementById('completed-text').innerHTML = '<b>Nailed it!</b><br/>You solved the Melodle in ' + ((timer-1000) / 1000).toString() + ' second(s).';
				}
				else
				{
					if (checkForSimilarArtist(songs[songVal], input))
					{
						document.getElementById('slot' + guess).classList.add('slot-artist');
						document.getElementById('x' + guess).innerHTML = MELODLE_ICONS.alert;
					}
					else
					{
						document.getElementById('slot' + guess).classList.add('slot-wrong');
						document.getElementById('x' + guess).innerHTML = MELODLE_ICONS.x;
					}

					if (guess == 6)
					{
						displayCorrectSong();
						document.getElementById('completed-text').innerHTML = "<b>Oh no!</b><br/>Better luck on the next Melodle!";
					}
					else
					{
						timer = timer + increment;
						increment = increment + 1000;
						guess++;
						updateActiveSlot();
					}
				}
			}
		}

		function autocomplete(inp, arr) {
			if (inp._autocompleteAbort)
			{
				inp._autocompleteAbort.abort();
			}
			const ac = new AbortController();
			inp._autocompleteAbort = ac;
			const sig = { signal: ac.signal };

			var currentFocus = -1;
			inp.addEventListener("input", function(e) {
				var a = null, b, i, val = this.value;
				closeAllLists();
				currentFocus = -1;
				if (!val || val.length < 2) { return false; }
				searchResults = 0;
				for (i = 0; i < arr.length; i++) {
					if (arr[i].toUpperCase().includes(val.toUpperCase())) {
						if (!a) {
							a = document.createElement("DIV");
							a.setAttribute("id", this.id + "autocomplete-list");
							a.setAttribute("class", "autocomplete-items");
							this.parentNode.appendChild(a);
						}
						const itemValue = arr[i];
						b = buildAutocompleteItem(itemValue, val, artistBySong.get(itemValue));
						b.addEventListener("click", function(e) {
							inp.value = itemValue;
							currentFocus = -1;
							closeAllLists();
						});
						a.appendChild(b);
						searchResults++;
					}
				}
			}, sig);
			inp.addEventListener("keydown", function(e) {
				var x = document.getElementById(this.id + "autocomplete-list");
				if (x) x = x.getElementsByTagName("div");
				if (e.keyCode == 40) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus++;
						addActive(x);
					}
				} else if (e.keyCode == 38) {
					if (x && x.length) {
						e.preventDefault();
						currentFocus--;
						addActive(x);
					}
				} else if (e.keyCode == 13) {
					e.preventDefault();
					if (currentFocus > -1 && x && x[currentFocus]) {
						x[currentFocus].click();
					} else {
						closeAllLists();
						checkAnswer();
					}
				}
			}, sig);
			function addActive(x) {
				if (!x || !x.length) return false;
				removeActive(x);
				if (currentFocus >= x.length) currentFocus = 0;
				if (currentFocus < 0) currentFocus = (x.length - 1);
				x[currentFocus].classList.add("autocomplete-active");
				x[currentFocus].scrollIntoView({ block: "nearest" });
			}
			function removeActive(x) {
				for (var i = 0; i < x.length; i++) {
					x[i].classList.remove("autocomplete-active");
				}
			}
			function closeAllLists(elmnt) {
				var x = document.getElementsByClassName("autocomplete-items");
				for (var i = 0; i < x.length; i++) {
					if (elmnt != x[i] && elmnt != inp) {
						x[i].parentNode.removeChild(x[i]);
						currentFocus = -1;
					}
				}
			}
			document.addEventListener("click", function (e) {
				closeAllLists(e.target);
			}, sig);
		}

		initDatePicker();
		document.addEventListener("DOMContentLoaded", function () {
			setDailySongVal();
		});
	</script>
